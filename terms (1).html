imit the number of requests, file sizes or access, and we may change or stop features at any time."]}, {"h": "Ownership", "p": ["The ElectroRed AI name, logo and design belong to its developer. Please do not use them in a way that suggests you are affiliated with the project."]}, {"h": "No warranty", "p": ["The service is provided “as is” and “as available”, without any guarantee of accuracy, availability or fitness for a particular purpose."]}, {"h": "Limitation of liability", "p": ["To the extent allowed by law, the developer is not liable for losses resulting from using, or being unable to use, the service, or from relying on its answers."]}, {"h": "Suspension", "p": ["We may suspend or remove access if these terms are broken or to protect the service and other users."]}, {"h": "Changes to these terms", "p": ["We may update these terms. The date at the top shows the latest version, and continuing to use the service means you accept the update."]}]}, "ar": {"h1": "شروط الاستخدام", "updated": "آخر تحديث: 31 أكتوبر 2026", "intro": "باستخدامك ElectroRed AI فإنك توافق على هذه الشروط. إن لم توافق فلا تستخدم الخدمة.", "sections": [{"h": "الخدمة", "p": ["ElectroRed AI مساعد دراسي مجاني بالذكاء الاصطناعي في الإلكترونيك. يشرح المفاهيم، ويساعد في التمارين والكود، ويحلل الصور والملفات التي تقدمها، ويمكنه إنشاء مستندات. هو أداة تعلّم وليس استشارة هندسية مهنية."]}, {"h": "الذكاء الاصطناعي قد يخطئ", "p": ["الإجابات يولّدها الذكاء الاصطناعي وقد تكون ناقصة أو قديمة أو خاطئة، بما في ذلك الحسابات والكود وقيم العناصر. تحقق دائماً من النتائج المهمة من مقرراتك أو من أستاذك أو من أوراق البيانات (datasheets).", "لا تعتمد عليه وحده في تصاميم حساسة للسلامة (الجهد العالي أو الكهرباء المنزلية، الطب، السيارات، الطيران) ولا في أي أمر قد يسبب خطؤه ضرراً."]}, {"h": "النزاهة الأكاديمية", "p": ["استخدم ElectroRed AI لتتعلّم. التزم بقواعد جامعتك حول الاستعانة بالذكاء الاصطناعي وحول الأعمال التي يجب أن تكون من إنجازك. أنت مسؤول عن كيفية استعمالك للإجابات."]}, {"h": "حسابك", "p": ["قدّم معلومات صحيحة، وأبقِ كلمة السر سرية، وتوقف عن استخدام الحساب إن شككت في إساءة استعماله. يمكن للزوار طرح عدد محدود من الأسئلة (حالياً 15) بدون حساب."]}, {"h": "الاستخدام المقبول", "p": ["توافق على ألا:"], "ul": ["تستخدم الخدمة لأغراض غير قانونية أو ضارة أو مسيئة", "تحاول تعطيل الخدمة أو إغراقها أو تجاوز حدودها (بما في ذلك الاستخدام الآلي أو بالسكربتات)", "ترفع محتوى لا تملك حق مشاركته", "تحاول استخراج التعليمات الخفية أو المفاتيح، أو تستخدم الخدمة لإيذاء الآخرين"]}, {"h": "محتواك", "p": ["تبقى ملكية ما تكتبه وترفعه لك. وتسمح لـ ElectroRed AI بمعالجته، بما في ذلك إرساله إلى مزوّدي الذكاء الاصطناعي، من أجل تقديم الخدمة. قد تشبه الإجابات التي تستلمها إجابات أُعطيت لأشخاص آخرين."]}, {"h": "الاستخدام العادل والحدود", "p": ["لإبقاء الخدمة مجانية للجميع، قد نحدّ عدد الطلبات أو أحجام الملفات أو الوصول، وقد نغيّر الميزات أو نوقفها في أي وقت."]}, {"h": "الملكية", "p": ["اسم ElectroRed AI وشعاره وتصميمه ملك لمطوّره. يرجى عدم استعمالها بشكل يوحي بأنك مرتبط بالمشروع."]}, {"h": "عدم وجود ضمان", "p": ["تُقدَّم الخدمة «كما هي» و«حسب توفرها»، دون أي ضمان للدقة أو التوفر أو الملاءمة لغرض معيّن."]}, {"h": "حدود المسؤولية", "p": ["بالقدر الذي يسمح به القانون، لا يتحمل المطوّر مسؤولية الخسائر الناتجة عن استخدام الخدمة أو عدم القدرة على استخدامها أو الاعتماد على إجاباتها."]}, {"h": "التعليق", "p": ["قد نعلّق الوصول أو نزيله إن خُرقت هذه الشروط أو لحماية الخدمة والمستخدمين الآخرين."]}, {"h": "تغيير الشروط", "p": ["قد نحدّث هذه الشروط. يوضّح التاريخ في الأعلى آخر نسخة، واستمرارك في استخدام الخدمة يعني قبولك للتحديث."]}]}};
const el = (tag, cls, html) => { const n = document.createElement(tag); if(cls) n.className = cls; if(html !== undefined) n.innerHTML = html; return n; };
function render(){
  const lang = getLang(), c = COMMON[lang], d = DOC[lang];
  Object.keys(c).forEach(id => { const n = document.getElementById(id); if(n) n.textContent = c[id]; });
  document.getElementById('h1').textContent = d.h1; document.getElementById('updated').textContent = d.updated; document.getElementById('intro').textContent = d.intro;
  const toc = document.getElementById('toc'), box = document.getElementById('sections'); toc.innerHTML = ''; box.innerHTML = '';
  d.sections.forEach((s, i) => {
    const li = el('li'); const a = el('a', '', s.h); a.href = '#s' + (i + 1); li.appendChild(a); toc.appendChild(li);
    const sec = el('section'); sec.id = 's' + (i + 1); sec.appendChild(el('h2', '', (i + 1) + '. ' + s.h));
    (s.p || []).forEach(t => sec.appendChild(el('p', '', t)));
    if(s.ul){ const ul = el('ul'); s.ul.forEach(t => ul.appendChild(el('li', '', t))); sec.appendChild(ul); }
    (s.p2 || []).forEach(t => sec.appendChild(el('p', '', t)));
    box.appendChild(sec);
  });
}
document.addEventListener('DOMContentLoaded', render);
document.getElementById('langToggle')?.addEventListener('click', () => setTimeout(render, 0));

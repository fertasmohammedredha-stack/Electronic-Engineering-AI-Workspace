<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Settings · ElectroRed AI</title>
<meta name="description" content="ElectroRed AI account and preferences.">
<meta name="theme-color" content="#07111F">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
<style>
  .s-wrap{max-width:620px; margin:0 auto; padding:28px 20px 60px;}
  .s-top{display:flex; align-items:center; gap:14px; margin-bottom:28px;}
  .s-back{width:38px; height:38px; border-radius:9px; border:1px solid var(--line); background:var(--surface); display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink); text-decoration:none; flex-shrink:0;}
  .s-top h1{font-size:21px;}
  .s-brand{margin-inline-start:auto; font-size:15px; text-decoration:none;}
  .profile-card{display:flex; align-items:center; gap:14px; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:18px; margin-bottom:24px;}
  .profile-card .avatar{width:52px; height:52px; font-size:19px;}
  .profile-card .name{font-size:16px; font-weight:600;}
  .profile-card .email{font-size:13px; color:var(--ink-soft);}
  .s-section{margin-bottom:26px;}
  .s-label{font-size:12px; color:var(--ink-soft); font-family:'JetBrains Mono',monospace; margin-bottom:10px;}
  .s-group{background:var(--surface); border:1px solid var(--line); border-radius:14px; overflow:hidden; box-shadow:var(--shadow);}
  .s-row{display:flex; align-items:center; justify-content:space-between; padding:15px 16px; border-bottom:1px solid var(--line); font-size:14.5px;}
  .s-group .s-row:last-child{border-bottom:none;}
  .s-row.link{cursor:pointer; color:inherit; text-decoration:none; display:flex;}
  .s-row.link:hover{background:var(--bg);}
  .s-row .chev{color:var(--ink-soft);}
  .seg{display:flex; background:var(--bg); border-radius:8px; padding:3px; gap:2px;}
  .seg button{border:none; background:transparent; padding:7px 14px; border-radius:6px; font-size:13.5px; cursor:pointer; color:var(--ink-soft); font-family:inherit;}
  .seg button.active{background:var(--surface); color:var(--ink); box-shadow:var(--shadow);}
  .danger{color:var(--danger);}
  html[dir="ltr"] .s-back{transform:scaleX(-1);}
  .hidden{display:none !important;}
  .s-key{white-space:nowrap;}
  .s-val{flex:1; min-width:0; text-align:end; color:var(--ink-soft); margin-inline:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:14px;}
  .s-btn{border:1px solid var(--line); background:var(--surface); color:var(--ink); border-radius:7px; padding:6px 13px; font:inherit; font-size:13px; cursor:pointer; flex-shrink:0;}
  .s-btn:hover{border-color:var(--blue);}
  .s-btn.primary{background:var(--copper); border-color:var(--copper); color:#fff;}
  .s-btn:disabled{opacity:.55; cursor:default;}
  .s-edit{display:flex; flex-direction:column; gap:10px; padding:12px 16px 14px; border-bottom:1px solid var(--line); background:var(--bg);}
  .s-edit input{width:100%; border:1px solid var(--line); background:var(--surface); color:var(--ink); border-radius:8px; padding:10px 12px; font:inherit; font-size:14.5px; outline:none;}
  .s-edit input:focus{border-color:var(--blue); box-shadow:0 0 0 3px color-mix(in srgb, var(--blue) 20%, transparent);}
  .s-edit-bar{display:flex; gap:8px; justify-content:flex-end;}
  .s-version{font-size:11.5px; color:var(--ink-soft); margin-top:8px; font-family:'JetBrains Mono',monospace; direction:ltr;}
  .s-version.warn{color:var(--danger);}
  .s-msg{font-size:13px; margin-top:8px; min-height:1.2em; padding:0 4px;}
  .s-msg.ok{color:var(--ok);}
  .s-msg.err{color:var(--danger);}
</style>
</head>
<body>
<div class="s-wrap">
  <div class="s-top">
    <a href="chat.html" class="s-back">→</a>
    <h1 data-i="settingsTitle"></h1>
    <a href="index.html" class="s-brand" data-er-logo="full" aria-label="ElectroRed AI"></a>
  </div>

  <div class="profile-card">
    <div class="avatar" id="avatarLetter" >?</div>
    <div>
      <div class="name" id="userName">—</div>
      <div class="email" id="userEmail">—</div>
    </div>
  </div>

  <div class="s-section">
    <div class="s-label" data-i="accountInfo"></div>
    <div class="s-group">
      <div class="s-row" id="nameRow">
        <span class="s-key" data-i="username"></span>
        <span class="s-val" id="nameVal">—</span>
        <button type="button" class="s-btn" id="nameEditBtn" data-i="edit"></button>
      </div>
      <div class="s-edit hidden" id="nameEdit">
        <input id="nameInput" maxlength="40" dir="auto" autocomplete="nickname">
        <div class="s-edit-bar">
          <button type="button" class="s-btn" id="nameCancel" data-i="cancel"></button>
          <button type="button" class="s-btn primary" id="nameSave" data-i="save"></button>
        </div>
      </div>
      <div class="s-row">
        <span class="s-key" data-i="email"></span>
        <span class="s-val" id="emailVal" dir="ltr">—</span>
      </div>
      <div class="s-row">
        <span class="s-key" data-i="signInMethod"></span>
        <span class="s-val" id="methodVal">—</span>
      </div>
      <div class="s-row" id="pwRow">
        <span class="s-key" data-i="password"></span>
        <span class="s-val" id="pwVal">••••••••</span>
        <button type="button" class="s-btn hidden" id="pwChangeBtn" data-i="change"></button>
      </div>
      <form class="s-edit hidden" id="pwForm" autocomplete="off">
        <input type="password" id="pwCurrent" data-i-ph="currentPassword" autocomplete="current-password">
        <input type="password" id="pwNew" data-i-ph="newPassword" autocomplete="new-password">
        <input type="password" id="pwConfirm" data-i-ph="confirmNewPassword" autocomplete="new-password">
        <div class="s-edit-bar">
          <button type="button" class="s-btn" id="pwCancel" data-i="cancel"></button>
          <button type="submit" class="s-btn primary" id="pwSave" data-i="save"></button>
        </div>
      </form>
    </div>
    <div class="s-msg" id="accountMsg" role="status" aria-live="polite"></div>
  </div>

  <div class="s-section">
    <div class="s-label" data-i="prefs"></div>
    <div class="s-group">
      <div class="s-row">
        <span data-i="language"></span>
        <div class="seg">
          <button id="langAr">AR</button>
          <button id="langEn">EN</button>
        </div>
      </div>
      <div class="s-row">
        <span data-i="theme"></span>
        <div class="seg">
          <button id="themeLight" data-i="light"></button>
          <button id="themeDark" data-i="dark"></button>
          <button id="themeSystem" data-i="system"></button>
        </div>
      </div>
    </div>
  </div>

  <div class="s-section">
    <div class="s-label" data-i="about"></div>
    <div class="s-group">
      <div class="s-row link" id="tosLink"><span data-i="tos"></span><span class="chev">›</span></div>
      <div class="s-row link" id="privacyLink"><span data-i="privacy"></span><span class="chev">›</span></div>
      <div class="s-row link" id="aboutLink" role="link" tabindex="0"><span data-i="aboutUs"></span><span class="chev">›</span></div>
      <div class="s-row link" id="contactLink"><span data-i="contact"></span><span class="chev">›</span></div>
    </div>
  </div>

  <div class="s-section">
    <div class="s-label" data-i="account"></div>
    <div class="s-group">
      <div class="s-row link" id="deleteChatsBtn"><span class="danger" data-i="deleteChats"></span></div>
      <div class="s-row link" id="logoutBtn"><span class="danger" data-i="logout"></span></div>
    </div>
  </div>

  <div style="text-align:center; margin-top:30px;">
    <span class="dev-credit">Developed by <b>Fertas Mohammed Redha</b></span>
    <div class="s-version" id="versionLine"></div>
  </div>
</div>

<script src="assets/brand.js"></script>
<script src="assets/lang.js"></script>
<script type="module">
import { watchAuth, signOutUser, deleteAllChats, getAccountInfo, updateDisplayName, changePassword } from './assets/firebase.js';

const $ = id => document.getElementById(id);
function showMsg(text, ok){ const el = $('accountMsg'); el.textContent = text || ''; el.className = 's-msg' + (text ? (ok ? ' ok' : ' err') : ''); }

// Fills the profile card and the "Account details" rows from the signed-in user.
function renderAccount(){
  const info = getAccountInfo();
  if(!info) return;
  const name = info.displayName || '';
  $('userName').textContent = name || '—';
  $('nameVal').textContent = name || '—';
  $('userEmail').textContent = info.email || '—';
  $('emailVal').textContent = info.email || '—';
  $('avatarLetter').textContent = (name || info.email || '?').charAt(0).toUpperCase();
  $('methodVal').textContent = info.hasPassword && info.hasGoogle ? tr('viaBoth') : info.hasPassword ? tr('viaEmail') : tr('viaGoogle');
  if(info.hasPassword){
    $('pwVal').textContent = '••••••••';
    $('pwChangeBtn').classList.remove('hidden');
  } else {
    // Google-only accounts have no password here — Google manages it.
    $('pwVal').textContent = tr('managedByGoogle');
    $('pwChangeBtn').classList.add('hidden');
    closePwForm();
  }
}

// ---- build check: compares this page's version with the live API's ----
(async () => {
  const el = $('versionLine');
  const web = typeof APP_VERSION === 'string' ? APP_VERSION : '?';
  let api = null;
  try { const r = await fetch('/api/chat'); if(r.ok) api = (await r.json()).version || null; } catch(e){}
  const same = api && api === web;
  el.textContent = 'Web ' + web + ' · API ' + (api || tr('versionUnknown')) + (same ? '' : ' — ' + tr('versionMismatch'));
  el.classList.toggle('warn', !same);
})();

// ---- username ----
function openNameEdit(){
  $('nameInput').value = (getAccountInfo() || {}).displayName || '';
  $('nameEdit').classList.remove('hidden'); $('nameRow').classList.add('hidden');
  showMsg('');
  $('nameInput').focus(); $('nameInput').select();
}
function closeNameEdit(){ $('nameEdit').classList.add('hidden'); $('nameRow').classList.remove('hidden'); }
async function saveName(){
  const v = $('nameInput').value.trim().replace(/\s+/g, ' ');
  if(v.length < 2 || v.length > 40){ showMsg(tr('errName'), false); return; }
  $('nameSave').disabled = true;
  try {
    await updateDisplayName(v);
    renderAccount(); closeNameEdit(); showMsg(tr('nameSaved'), true);
  } catch(err){
    console.error('Updating the name failed:', err);
    showMsg(tr('errGeneric'), false);
  } finally { $('nameSave').disabled = false; }
}
$('nameEditBtn').addEventListener('click', openNameEdit);
$('nameCancel').addEventListener('click', () => { closeNameEdit(); showMsg(''); });
$('nameSave').addEventListener('click', saveName);
$('nameInput').addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); saveName(); } if(e.key === 'Escape') closeNameEdit(); });

// ---- password (email/password accounts only) ----
function closePwForm(){ $('pwForm').classList.add('hidden'); $('pwForm').reset(); }
const PW_ERRORS = { 'auth/wrong-password': 'errPwWrong', 'auth/invalid-credential': 'errPwWrong', 'auth/invalid-login-credentials': 'errPwWrong', 'auth/weak-password': 'errPwWeak', 'auth/too-many-requests': 'errTooMany' };
$('pwChangeBtn').addEventListener('click', () => { $('pwForm').classList.remove('hidden'); showMsg(''); $('pwCurrent').focus(); });
$('pwCancel').addEventListener('click', () => { closePwForm(); showMsg(''); });
$('pwForm').addEventListener('submit', async e => {
  e.preventDefault();
  const cur = $('pwCurrent').value, nw = $('pwNew').value, cf = $('pwConfirm').value;
  if(nw.length < 6){ showMsg(tr('errPwWeak'), false); return; }
  if(nw !== cf){ showMsg(tr('errPwMismatch'), false); return; }
  if(nw === cur){ showMsg(tr('errPwSame'), false); return; }
  $('pwSave').disabled = true;
  try {
    await changePassword(cur, nw);
    closePwForm(); showMsg(tr('passwordChanged'), true);
  } catch(err){
    console.error('Changing the password failed:', err);
    showMsg(tr(PW_ERRORS[err.code] || 'errGeneric'), false);
  } finally { $('pwSave').disabled = false; }
});

watchAuth(user => {
  if(!user){ location.href = 'chat.html'; return; }
  renderAccount();

  document.getElementById('deleteChatsBtn').addEventListener('click', async ()=>{
    if(confirm(getLang()==='ar' ? 'حذف كل المحادثات نهائيًا؟' : 'Permanently delete all chats?')){
      try {
        await deleteAllChats(user.uid);
        localStorage.removeItem('lastOpenChat');
        alert(getLang()==='ar' ? 'تم الحذف.' : 'Deleted.');
      } catch(err){
        console.error('Delete all chats failed:', err);
        alert(getLang()==='ar' ? 'تعذر حذف المحادثات. حاول مرة ثانية.' : "Couldn't delete the chats. Please try again.");
      }
    }
  });
});

document.getElementById('logoutBtn').addEventListener('click', async ()=>{
  await signOutUser();
  location.href = 'index.html';
});

// language segmented control
function syncLangUI(){
  const l = getLang();
  document.getElementById('langAr').classList.toggle('active', l==='ar');
  document.getElementById('langEn').classList.toggle('active', l==='en');
}
document.getElementById('langAr').addEventListener('click', ()=>{ setLang('ar'); syncLangUI(); renderAccount(); });
document.getElementById('langEn').addEventListener('click', ()=>{ setLang('en'); syncLangUI(); renderAccount(); });

// theme segmented control
function syncThemeUI(){
  const saved = localStorage.getItem('theme');
  document.getElementById('themeLight').classList.toggle('active', saved==='light');
  document.getElementById('themeDark').classList.toggle('active', saved==='dark');
  document.getElementById('themeSystem').classList.toggle('active', !saved);
}
document.getElementById('themeLight').addEventListener('click', ()=>{ setTheme('light'); syncThemeUI(); });
document.getElementById('themeDark').addEventListener('click', ()=>{ setTheme('dark'); syncThemeUI(); });
document.getElementById('themeSystem').addEventListener('click', ()=>{ setTheme('system'); syncThemeUI(); });

const placeholderLinks = {
  tosLink: 'tos', privacyLink: 'privacy', contactLink: 'contact'
};
const goAbout = () => { location.href = 'about.html'; };
document.getElementById('aboutLink').addEventListener('click', goAbout);
document.getElementById('aboutLink').addEventListener('keydown', e => { if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); goAbout(); } });
Object.keys(placeholderLinks).forEach(id=>{
  document.getElementById(id).addEventListener('click', ()=>{
    alert(getLang()==='ar' ? 'هذه الصفحة قيد الإعداد.' : 'This page is coming soon.');
  });
});

document.addEventListener('DOMContentLoaded', ()=>{ syncLangUI(); syncThemeUI(); });
</script>
</body>
</html>

  @media (max-width:560px){ header.site .wrap{height:62px; padding:0 14px;} .logo{font-size:15px;} .head-actions{gap:6px;} .cta{padding:8px 12px; font-size:13px;} .lang-btn{padding:6px 10px;} .theme-btn{width:34px; height:34px;} }

<script>
const COMMON = {
  ar:{ navHome:"الرئيسية", navAbout:"عن المشروع", navPrivacy:"الخصوصية", navTerms:"الشروط", navCta:"ابدأ الآن", fAbout:"عن المشروع", fPrivacy:"الخصوصية", fTerms:"الشروط", tocT:"المحتويات" },
  en:{ navHome:"Home", navAbout:"About", navPrivacy:"Privacy", navTerms:"Terms", navCta:"Get started", fAbout:"About", fPrivacy:"Privacy", fTerms:"Terms", tocT:"Contents" }
};
const DOC = {"en": {"h1": "Privacy Policy", "updated": "Last updated: 31 October 2026", "intro": "ElectroRed AI is a study tool for electronics students, developed by Fertas Mohammed Redha as a university project. This page explains, in plain language, what information the service uses and why.", "sections": [{"h": "What we collect", "ul": ["<b>Account.</b> When you create an account we receive your email address and your name (from the form, or from Google if you sign in with Google). Sign-in is handled by Firebase Authentication (Google). We never see or store your password.", "<b>Conversations.</b> If you are signed in, your messages and the answers are saved to your account so you can reopen them. This includes the text of your messages, small images you attach, the names of attached files, a short excerpt of attached text that keeps follow-up questions working, and your 👍/👎 ratings.", "<b>Guests.</b> If you use the app as a guest, your conversation and the number of questions you have used stay in your browser (local storage), on your device only.", "<b>Preferences.</b> Your language and theme choices are kept in your browser.", "<b>Usage statistics.</b> We use Firebase Analytics (Google) to count things such as page views, sign-ins, messages sent and errors. These events do not contain the text of your messages.", "<b>Technical data.</b> Like any website, our hosting provider and the services we use receive technical data such as your IP address and browser type. We use IP addresses to limit abuse (rate limiting)."]}, {"h": "How your messages are answered", "p": ["To produce an answer, your message, the recent conversation and any image or file you attach are sent from your browser to our server and then to third-party AI providers (currently Groq and Google). Their processing is subject to their own terms and privacy policies.", "ElectroRed AI does not store your messages on its own server; the server only passes them on. Please do not send passwords, ID numbers or other sensitive personal information."]}, {"h": "Voice input", "p": ["If you use the microphone button, speech recognition is performed by your browser’s built-in service (in Chrome and Edge this sends audio to the browser vendor’s servers). ElectroRed AI only receives the resulting text."]}, {"h": "Files you create", "p": ["Word, PDF, Excel, PowerPoint and code files are generated in your browser. They are not uploaded anywhere by ElectroRed AI."]}, {"h": "Third-party services", "p": ["The service relies on:"], "ul": ["Google Firebase (sign-in, database, analytics)", "Vercel (hosting)", "Groq and Google (AI processing)", "Google Fonts and public code libraries from CDNs such as jsDelivr and cdnjs. These may receive your IP address when your browser loads them."]}, {"h": "Cookies and local storage", "p": ["We use local storage for your preferences and your guest conversation. Firebase and Google Analytics may use identifiers (cookies or local storage) to keep you signed in and to count visits."]}, {"h": "Keeping and deleting your data", "ul": ["Conversations stay in your account until you delete them.", "You can delete one conversation from its menu in the chat, or all your conversations from Settings. Deleting a conversation removes its messages.", "Guest data can be removed by clearing this site’s data in your browser.", "Deleting your whole account is not yet available inside the app."]}, {"h": "Security", "p": ["Access to your saved conversations is limited to your account by database security rules, and all traffic uses HTTPS. No online service is perfectly secure, so please share responsibly."]}, {"h": "Children", "p": ["ElectroRed AI is meant for university-level students. It is not directed to children under 13."]}, {"h": "Changes to this policy", "p": ["We may update this page. The date at the top shows the latest version."]}]}, "ar": {"h1": "سياسة الخصوصية", "updated": "آخر تحديث: 31 أكتوبر 2026", "intro": "ElectroRed AI أداة دراسة لطلبة الإلكترونيك، طوّرها Fertas Mohammed Redha كمشروع جامعي. توضّح هذه الصفحة بلغة بسيطة ما المعلومات التي تستخدمها الخدمة ولماذا.", "sections": [{"h": "ما الذي نجمعه", "ul": ["<b>الحساب.</b> عند إنشاء حساب نستلم بريدك الإلكتروني واسمك (من النموذج أو من Google إن سجّلت بها). يتم تسجيل الدخول عبر Firebase Authentication من Google. لا نرى كلمة السر ولا نخزّنها.", "<b>المحادثات.</b> إن كنت مسجّلاً، تُحفظ رسائلك والإجابات في حسابك لتعود إليها. يشمل ذلك نص رسائلك، والصور الصغيرة التي ترفقها، وأسماء الملفات المرفقة، ومقتطفاً قصيراً من النص المرفق يبقي الأسئلة التالية تعمل، وتقييماتك 👍/👎.", "<b>الزوار.</b> إن استعملت التطبيق كزائر، تبقى محادثتك وعدد الأسئلة المستخدمة في متصفحك (التخزين المحلي) وعلى جهازك فقط.", "<b>التفضيلات.</b> اختياراتك للغة والمظهر تُحفظ في متصفحك.", "<b>إحصاءات الاستخدام.</b> نستخدم Firebase Analytics (من Google) لعدّ أمور مثل مشاهدات الصفحات وتسجيلات الدخول والرسائل المرسلة والأخطاء. هذه الأحداث لا تتضمن نص رسائلك.", "<b>بيانات تقنية.</b> كأي موقع، يستلم مزوّد الاستضافة والخدمات التي نستعملها بيانات تقنية مثل عنوان IP ونوع المتصفح. نستخدم عناوين IP للحد من إساءة الاستخدام (تحديد معدل الطلبات)."]}, {"h": "كيف تتم الإجابة على رسائلك", "p": ["لإنتاج الإجابة، تُرسَل رسالتك والمحادثة الأخيرة وأي صورة أو ملف ترفقه من متصفحك إلى خادمنا ثم إلى مزوّدي ذكاء اصطناعي خارجيين (حالياً Groq وGoogle). تخضع معالجتهم لشروطهم وسياسات الخصوصية الخاصة بهم.", "لا يخزّن ElectroRed AI رسائلك على خادمه الخاص؛ الخادم يمرّرها فقط. يرجى عدم إرسال كلمات السر أو أرقام الهوية أو معلومات شخصية حساسة."]}, {"h": "الإدخال الصوتي", "p": ["إن استعملت زر الميكروفون، يتم التعرف على الكلام بالخدمة المدمجة في متصفحك (في Chrome وEdge يُرسَل الصوت إلى خوادم مطوّر المتصفح). ElectroRed AI يستلم النص الناتج فقط."]}, {"h": "الملفات التي تنشئها", "p": ["ملفات Word وPDF وExcel وPowerPoint والكود تُنشَأ داخل متصفحك. لا يرفعها ElectroRed AI إلى أي مكان."]}, {"h": "خدمات الأطراف الخارجية", "p": ["تعتمد الخدمة على:"], "ul": ["Google Firebase (تسجيل الدخول وقاعدة البيانات والتحليلات)", "Vercel (الاستضافة)", "Groq وGoogle (معالجة الذكاء الاصطناعي)", "خطوط Google ومكتبات برمجية عامة من شبكات CDN مثل jsDelivr وcdnjs. قد تستلم هذه عنوان IP الخاص بك عندما يحمّلها متصفحك."]}, {"h": "ملفات الارتباط والتخزين المحلي", "p": ["نستخدم التخزين المحلي لتفضيلاتك ومحادثة الزائر. وقد تستخدم Firebase وGoogle Analytics معرّفات (ملفات ارتباط أو تخزين محلي) لإبقائك مسجّلاً الدخول ولعدّ الزيارات."]}, {"h": "الاحتفاظ ببياناتك وحذفها", "ul": ["تبقى المحادثات في حسابك حتى تحذفها.", "يمكنك حذف محادثة من قائمتها في الدردشة، أو حذف كل محادثاتك من الإعدادات. حذف المحادثة يحذف رسائلها.", "يمكن إزالة بيانات الزائر بمسح بيانات هذا الموقع من متصفحك.", "حذف حسابك بالكامل غير متاح بعد داخل التطبيق."]}, {"h": "الأمان", "p": ["الوصول إلى محادثاتك المحفوظة مقصور على حسابك بقواعد أمان قاعدة البيانات، وكل الاتصالات عبر HTTPS. لا توجد خدمة إلكترونية آمنة تماماً، فاحرص على ما تشاركه."]}, {"h": "الأطفال", "p": ["ElectroRed AI موجّه لطلبة المستوى الجامعي، وليس موجّهاً للأطفال دون 13 سنة."]}, {"h": "تغييرات هذه السياسة", "p": ["قد نحدّث هذه الصفحة. يوضّح التاريخ في الأعلى آخر نسخة."]}]}};
const el = (tag, cls, html) => { const n = document.createElement(tag); if(cls) n.className = cls; if(html !== undefined) n.innerHTML = html; return n; };
function render(){
  const lang = getLang(), c = COMMON[lang], d = DOC[lang];
  Object.keys(c).forEach(id => { const n = document.getElementById(id); if(n) n.textContent = c[id]; });
  document.getElementById('h1').textContent = d.h1; document.getElementById('updated').textContent = d.updated; document.getElementById('intro').textContent = d.intro;
  const toc = document.getElementById('toc'), box = document.getElementById('sections'); toc.innerHTML = ''; box.innerHTML = '';
  d.sections.forEach((s, i) => {
    const li = el('li'); const a = el('a', '', s.h); a.href = '#s' + (i + 1); li.appendChild(a); toc.appendChild(li);
    const sec = el('section'); sec.id = 's' + (i + 1); sec.appendChild(el('h2', '', (i + 1) + '. ' + s.h));
    (s.p || []).forEach(t => sec.appendChild(el('p', '', t)));
    if(s.ul){ const ul = el('ul'); s.ul.forEach(t => ul.appendChild(el('li', '', t))); sec.appendChild(ul); }
    (s.p2 || []).forEach(t => sec.appendChild(el('p', '', t)));
    box.appendChild(sec);
  });
}
document.addEventListener('DOMContentLoaded', render);
document.getElementById('langToggle')?.addEventListener('click', () => setTimeout(render, 0));
</script>

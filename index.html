  .eyebrow{font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--cyan); margin-bottom:16px; direction:ltr; text-align:start;}

  .hero p.lead{font-size:17px; color:var(--ink-soft); max-width:520px; margin-bottom:24px;}

  .panel-mark{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;}

  .flist{display:grid; grid-template-columns:repeat(2,1fr); gap:14px;}
  .frow{display:flex; gap:16px; background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:20px;}

  .up-item{position:relative; padding:0 0 26px;}

const el = (tag, cls, text) => { const n = document.createElement(tag); if(cls) n.className = cls; if(text !== undefined) n.textContent = text; return n; };

function monthLabel(ym){
  try { return new Intl.DateTimeFormat(getLang() === 'ar' ? 'ar-DZ-u-nu-latn' : 'en-GB', { month: 'long', year: 'numeric' }).format(new Date(ym + '-01T12:00:00')); }
  catch(e){ return ym; }
}

// Builds the "what's new" timeline + the hero pill from the UPDATES list above (newest first).
function renderUpdates(){
  const lang = getLang(), c = CONTENT[lang];
  const tagText = { new: c.tagNew, improved: c.tagImproved, soon: c.tagSoon };
  const soon = UPDATES.filter(u => u.tag === 'soon');
  const done = UPDATES.filter(u => u.tag !== 'soon');
  document.getElementById('uk').textContent = c.uk;
  document.getElementById('uh').textContent = c.uh;
  document.getElementById('up').textContent = c.up;
  document.getElementById('upSoonWrap').hidden = !soon.length;
  document.getElementById('upSoonLabel').textContent = c.soonLabel;
  const soonBox = document.getElementById('upSoon'); soonBox.innerHTML = '';
  soon.forEach(u => {
    const card = el('div', 'up-soon-card');
    card.append(el('span', 'tag soon', tagText.soon), el('h3', '', u.title[lang]), el('p', '', u.text[lang]));
    soonBox.appendChild(card);
  });
  const box = document.getElementById('upTimeline'); box.innerHTML = '';
  let lastMonth = null, line = null;
  done.forEach(u => {
    if(u.date !== lastMonth){
      lastMonth = u.date;
      box.appendChild(el('div', 'up-month', monthLabel(u.date)));
      line = el('div', 'timeline'); box.appendChild(line);
    }
    const item = el('div', 'up-item');
    item.append(el('span', 'tag ' + u.tag, tagText[u.tag]), el('h3', '', u.title[lang]), el('p', '', u.text[lang]));
    line.appendChild(item);
  });
  const pill = document.getElementById('newPill');
  if(done.length){ pill.hidden = false; pill.innerHTML = ''; pill.append(el('b', '', c.newLabel), el('span', '', done[0].title[lang] + (lang === 'ar' ? ' ←' : ' →'))); }
  else pill.hidden = true;
}

function renderContent(){
  const c = CONTENT[getLang()];
  const set = (id, v) => { document.getElementById(id).textContent = v; };
  ['navTools','navWhy','navUpdates','navAbout','footAbout','navLogin','navCta','eyebrow','btn1','btn2','tk','th','tp','fk','fh','fp','banP','banBtn'].forEach(id => set(id, c[id] !== undefined ? c[id] : ({tk:c.tk,th:c.th}[id])));
  document.getElementById('heroH1').innerHTML = c.h1;
  set('heroP', c.p); set('toolsNote', c.note);
  document.getElementById('banH').innerHTML = c.banH;
  const pills = document.getElementById('heroPills'); pills.innerHTML = '';
  c.pills.forEach(([ic, label]) => { const s = el('span'); s.innerHTML = SVG[ic]; s.append(document.createTextNode(label)); pills.appendChild(s); });
  const grid = document.getElementById('toolsGrid'); grid.innerHTML = '';
  c.tools.forEach(([ic, h, p]) => { const a = el('article', 'tool'); const i = el('div', 'tool-ic'); i.innerHTML = SVG[ic]; a.append(i, el('h3', '', h), el('p', '', p)); grid.appendChild(a); });
  const flist = document.getElementById('flist'); flist.innerHTML = '';
  c.features.forEach((f, i) => { const row = el('div', 'frow'); const n = el('div', 'num', String(i + 1).padStart(2, '0')); const b = el('div'); b.append(el('h3', '', f[0]), el('p', '', f[1])); row.append(n, b); flist.appendChild(row); });
  renderUpdates();
}
document.addEventListener('DOMContentLoaded', renderContent);

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دارة — مساعدك الذكي في الإلكترونيك</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
<style>
  .hero{padding:76px 0 60px;}
  .hero .wrap{display:grid; grid-template-columns:1.1fr 1fr; gap:48px; align-items:center;}
  .eyebrow{color:var(--copper-deep); font-size:14px; font-weight:600; margin-bottom:16px;}
  .hero h1{font-size:44px; line-height:1.18; margin-bottom:20px;}
  .hero h1 span{color:var(--green);}
  .hero p{font-size:17px; color:var(--ink-soft); max-width:46ch; margin-bottom:30px;}
  .hero-ctas{display:flex; gap:14px; flex-wrap:wrap;}
  .circuit{width:100%; height:auto;}
  .stats{border-top:1px solid var(--line); border-bottom:1px solid var(--line); padding:22px 0;}
  .stats .wrap{display:flex; justify-content:space-between; flex-wrap:wrap; gap:16px;}
  .stat b{font-size:22px; font-family:'JetBrains Mono',monospace; color:var(--green); display:block;}
  .stat span{font-size:13px; color:var(--ink-soft);}
  .features{padding:80px 0;}
  .section-head{max-width:56ch; margin-bottom:44px;}
  .section-head h2{font-size:30px; margin-bottom:10px;}
  .flist{display:flex; flex-direction:column;}
  .frow{display:grid; grid-template-columns:44px 1fr; gap:20px; padding:26px 0; border-top:1px solid var(--line);}
  .flist .frow:last-child{border-bottom:1px solid var(--line);}
  .frow .num{font-family:'JetBrains Mono',monospace; color:var(--copper); font-size:14px; padding-top:3px;}
  .frow h3{font-size:18px; margin-bottom:6px;}
  .frow p{color:var(--ink-soft); font-size:15px; max-width:60ch;}
  footer{border-top:1px solid var(--line); padding:30px 0; font-size:13.5px; color:var(--ink-soft);}
  footer .wrap{display:flex; justify-content:space-between; flex-wrap:wrap; gap:12px;}
  @media (max-width:860px){
    .hero .wrap{grid-template-columns:1fr;} .hero{padding:44px 0 40px;} .hero h1{font-size:32px;}
    .circuit{order:-1; max-width:280px; margin:0 auto;}
  }
</style>
</head>
<body>
<header class="site">
  <div class="wrap">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="2.4" fill="#C87F3B"/><path d="M12 2v5.2M12 16.8V22M2 12h5.2M16.8 12H22M5 5l3.7 3.7M15.3 15.3L19 19M19 5l-3.7 3.7M8.7 15.3L5 19" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      <span data-i="brand">دارة</span>
    </div>
    <div style="display:flex; gap:10px; align-items:center;">
      <button class="lang-btn" id="langToggle">EN</button>
      <a href="chat.html" class="cta" data-i="navCta">ابدأ مجانًا</a>
    </div>
  </div>
</header>

<section class="hero">
  <div class="wrap">
    <div>
      <div class="eyebrow mono">مخصص لطلبة وتقنيي الإلكترونيك 🇩🇿</div>
      <h1 id="heroH1"></h1>
      <p id="heroP"></p>
      <div class="hero-ctas">
        <a href="chat.html" class="btn-primary" id="btn1"></a>
        <a href="#features" class="btn-ghost" id="btn2"></a>
      </div>
    </div>
    <svg class="circuit" viewBox="0 0 420 340" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M40 60H140M140 60V150M140 150H80M80 150V230M140 150H220M220 150V90M220 90H300M300 90V180M300 180H370M300 180V260M220 260H300M60 230H140M60 230V290M220 260H140M220 260V310" stroke="#C87F3B" stroke-width="2" stroke-linecap="round"/>
      <circle cx="40" cy="60" r="5" fill="#2F6B4F"/><circle cx="370" cy="180" r="5" fill="#2F6B4F"/>
      <circle cx="60" cy="290" r="5" fill="#2F6B4F"/><circle cx="220" cy="310" r="5" fill="#2F6B4F"/>
      <rect x="60" y="200" width="40" height="60" rx="4" stroke="currentColor" stroke-width="2" fill="var(--surface)"/>
      <path d="M62 220H98M62 240H98" stroke="currentColor" stroke-width="1.5"/>
      <rect x="255" y="60" width="90" height="60" rx="6" stroke="currentColor" stroke-width="2" fill="var(--surface)"/>
      <path d="M270 60V48M290 60V48M310 60V48M330 60V48M270 120V132M290 120V132M310 120V132M330 120V132" stroke="currentColor" stroke-width="1.5"/>
      <text x="278" y="95" font-family="JetBrains Mono" font-size="13" fill="currentColor">IC</text>
      <path d="M120 150 L140 130 L160 150 L140 170 Z" stroke="currentColor" stroke-width="2" fill="var(--surface)"/>
      <text x="105" y="115" font-family="JetBrains Mono" font-size="11" fill="currentColor">5V</text>
      <text x="335" y="205" font-family="JetBrains Mono" font-size="11" fill="currentColor">10kΩ</text>
    </svg>
  </div>
</section>

<div class="stats">
  <div class="wrap">
    <div class="stat"><b>24/7</b><span>إجابات فورية</span></div>
    <div class="stat"><b class="mono">AR / EN</b><span>بلغتين</span></div>
    <div class="stat"><b>100%</b><span>مجاني</span></div>
    <div class="stat"><b class="mono">3+</b><span>سنوات دراسية مدعومة</span></div>
  </div>
</div>

<section class="features" id="features">
  <div class="wrap">
    <div class="section-head"><h2 id="fh"></h2><p id="fp"></p></div>
    <div class="flist" id="flist"></div>
  </div>
</section>

<footer><div class="wrap">
  <span>© 2026 دارة — مساعدك في الإلكترونيك</span>
  <span>صُنع من قبل طالب إلكترونيك، لطلاب الإلكترونيك</span>
</div></footer>

<script src="assets/lang.js"></script>
<script>
const CONTENT = {
  ar:{ h1:'مساعدك الذكي في <span>الإلكترونيك</span>',
    p:"اشرح دروسك، حلّ تمارينك، وافهم مشاريعك — مساعد ذكاء اصطناعي مبني خصيصًا لمناهج الإلكترونيك، بالعربية والإنجليزية.",
    btn1:"جرّب المساعد", btn2:"كيف يعمل", fh:"مبني لطريقة تفكيرك، لا لطريقة تفكير الآلة",
    fp:"كل ميزة مصمّمة حول احتياج حقيقي لطالب إلكترونيك، من أول سنة لحد التخرج.",
    features:[["شرح خطوة بخطوة","يفكك أي درس أو تمرين إلى خطوات مرتبة مع مثال محلول."],
      ["رفع الصور والملفات","صوّر مخطط دارة أو مسألة مكتوبة بخط اليد، ويحللها لك مباشرة."],
      ["مبني على المنهج الجزائري","إجابات مرتبطة بما تدرسه فعليًا في الجامعة."],
      ["محاكاة تفاعلية داخل المحادثة","جرّب قانون أوم أو دارة RC مباشرة بسلايدرات تفاعلية."]]},
  en:{ h1:'Your AI tutor for <span>electronics</span>',
    p:"Explain your lessons, solve exercises, and understand your projects — built specifically for electronics curricula, in Arabic and English.",
    btn1:"Try the assistant", btn2:"How it works", fh:"Built around how you think, not how a model thinks",
    fp:"Every feature answers a real need for an electronics student, from year one to graduation.",
    features:[["Step-by-step explanations","Breaks down any lesson into ordered steps with a solved example."],
      ["Upload images & files","Photograph a circuit or handwritten problem for instant analysis."],
      ["Built for the Algerian curriculum","Answers grounded in what you actually study."],
      ["Interactive in-chat simulations","Try Ohm's law or an RC circuit live with interactive sliders."]]}
};
function renderContent(){
  const c = CONTENT[getLang()];
  document.getElementById('heroH1').innerHTML = c.h1;
  document.getElementById('heroP').textContent = c.p;
  document.getElementById('btn1').textContent = c.btn1;
  document.getElementById('btn2').textContent = c.btn2;
  document.getElementById('fh').textContent = c.fh;
  document.getElementById('fp').textContent = c.fp;
  const flist = document.getElementById('flist'); flist.innerHTML='';
  c.features.forEach((f,i)=>{
    const row=document.createElement('div'); row.className='frow';
    row.innerHTML=`<div class="num">${String(i+1).padStart(2,'0')}</div><div><h3>${f[0]}</h3><p>${f[1]}</p></div>`;
    flist.appendChild(row);
  });
}
document.addEventListener('DOMContentLoaded', renderContent);
document.getElementById('langToggle')?.addEventListener('click', ()=> setTimeout(renderContent,0));
</script>
</body>
</html>

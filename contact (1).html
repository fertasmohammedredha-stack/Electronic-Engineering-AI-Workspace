<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="description" content="Contact ElectroRed AI: questions, feedback, bug reports and data requests.">

<link rel="icon" href="/favicon.ico?v=19" sizes="48x48">
<link rel="icon" href="/favicon.svg?v=19" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=19">
<link rel="manifest" href="/site.webmanifest">

<meta property="og:site_name" content="ElectroRed AI">

<meta property="og:image" content="https://electronic-engineering-ai-workspace.vercel.app/assets/brand/og-image.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
<style>
  header.site .wrap{height:70px;}
  .site-nav{display:flex; gap:26px; margin-inline-start:34px; margin-inline-end:auto;}
  .site-nav a{font-size:14.5px; color:var(--ink-soft); text-decoration:none; padding:6px 2px; border-bottom:2px solid transparent;}
  .site-nav a:hover, .site-nav a[aria-current="page"]{color:var(--ink); border-bottom-color:var(--red);}
  .head-actions{display:flex; gap:10px; align-items:center;}
  .doc{max-width:800px; margin:0 auto; padding:56px 24px 30px;}
  .kicker{font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--red); margin-bottom:12px; direction:ltr; text-align:start;}
  html[dir="rtl"] .kicker{text-align:right;}
  .doc h1{font-size:clamp(30px,4.4vw,44px); line-height:1.15; margin-bottom:10px;}
  .updated{font-size:13.5px; color:var(--ink-soft); margin-bottom:22px;}
  .intro{font-size:16.5px; color:var(--ink-soft); margin-bottom:26px;}
  .toc{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px 20px; margin-bottom:34px;}
  .toc b{display:block; font-size:13px; font-family:'JetBrains Mono',monospace; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-soft); margin-bottom:8px;}
  .toc ol{padding-inline-start:20px; display:grid; grid-template-columns:repeat(2,1fr); gap:4px 24px;}
  .toc a{color:var(--blue); text-decoration:none; font-size:14.5px;} .toc a:hover{text-decoration:underline;}
  .doc section{padding:20px 0; border-top:1px solid var(--line); scroll-margin-top:84px;}
  .doc h2{font-size:21px; margin-bottom:10px;}
  .doc p{color:var(--ink-soft); font-size:15.5px; margin-bottom:10px;}
  .doc ul{list-style:none; display:flex; flex-direction:column; gap:9px; margin:6px 0;}
  .doc li{color:var(--ink-soft); font-size:15.5px; padding-inline-start:20px; position:relative; line-height:1.7;}
  .doc li::before{content:""; position:absolute; inset-inline-start:0; top:.72em; width:7px; height:7px; border-radius:50%; background:var(--cyan);}
  .doc li b, .doc p b{color:var(--ink);}
  .doc p a{color:var(--blue); text-decoration:underline;}
  footer{border-top:1px solid var(--line); padding:26px 0; font-size:13px; color:var(--ink-soft); margin-top:30px;}
  footer .wrap{display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;}
  footer .foot-brand{display:flex; align-items:center; gap:10px; font-size:15px;}
  footer a{color:var(--ink-soft); text-decoration:underline;} footer a:hover{color:var(--ink);}
  @media (max-width:800px){ .site-nav{display:none;} .doc{padding:34px 18px 20px;} .toc ol{grid-template-columns:1fr;} }
  @media (max-width:560px){ header.site .wrap{height:62px; padding:0 14px;} .logo{font-size:15px;} .head-actions{gap:6px;} .cta{padding:8px 12px; font-size:13px;} .lang-btn{padding:6px 10px;} .theme-btn{width:34px; height:34px;} }
  .mailcard{display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; background:linear-gradient(120deg, color-mix(in srgb, var(--surface) 88%, var(--er-red)), var(--surface) 55%, color-mix(in srgb, var(--surface) 88%, var(--er-blue))); border:1px solid var(--line-strong); border-radius:16px; padding:22px 24px; margin:6px 0 26px;}
  .mailcard .addr{font-family:'JetBrains Mono',monospace; font-size:17px; direction:ltr; word-break:break-all; color:var(--ink);}
  .mailcard .lbl{font-size:13px; color:var(--ink-soft); margin-bottom:4px;}
  .mailbtns{display:flex; gap:10px; flex-wrap:wrap;}
  .mailbtns .btn-primary, .mailbtns .btn-ghost{padding:10px 18px; font-size:14px;}
</style>
</head>
<body>
<header class="site">
  <div class="wrap">
    <a class="logo" href="index.html" data-er-logo="full" aria-label="ElectroRed AI"></a>
    <nav class="site-nav" aria-label="Primary"><a href="index.html" id="navHome"></a><a href="about.html" id="navAbout"></a><a href="privacy.html" id="navPrivacy"></a><a href="terms.html" id="navTerms"></a></nav>
    <div class="head-actions">
      <button class="theme-btn" id="themeToggle" type="button" aria-label="Theme">🌙</button>
      <button class="lang-btn" id="langToggle" type="button">EN</button>
      <a href="auth.html" class="cta" id="navCta" data-session-cta></a>
    </div>
  </div>
</header>
<main class="doc">
  <div class="kicker">CONTACT</div>
  <h1 id="h1"></h1>
  <p class="intro" id="intro"></p>
  <div class="mailcard">
    <div><div class="lbl" id="lbl"></div><div class="addr" id="addr">fertasmohammedredha@gmail.com</div></div>
    <div class="mailbtns"><a class="btn-primary" id="mailBtn" href="mailto:fertasmohammedredha@gmail.com"></a><button class="btn-ghost" id="copyBtn" type="button"></button></div>
  </div>
  <div id="sections"></div>
</main>
<footer><div class="wrap">
  <div class="foot-brand"><span data-er-logo="compact" data-size="26"></span><span class="er-wm" data-er-logo="word"></span></div>
  <span>© 2026 ElectroRed AI · <a href="about.html" id="fAbout"></a> · <a href="privacy.html" id="fPrivacy"></a> · <a href="terms.html" id="fTerms"></a> · <a href="contact.html" id="fContact"></a></span>
  <span class="dev-credit">Developed by <b>Fertas Mohammed Redha</b></span>
</div></footer>
<script src="assets/brand.js"></script>
<script src="assets/lang.js"></script>
<script type="module" src="assets/analytics.js"></script>
<script>
const EMAIL = "fertasmohammedredha@gmail.com";
const COMMON = {
  ar:{ navHome:"الرئيسية", navAbout:"عن المشروع", navPrivacy:"الخصوصية", navTerms:"الشروط", navCta:"ابدأ الآن", fAbout:"عن المشروع", fPrivacy:"الخصوصية", fTerms:"الشروط", fContact:"اتصل بنا" },
  en:{ navHome:"Home", navAbout:"About", navPrivacy:"Privacy", navTerms:"Terms", navCta:"Get started", fAbout:"About", fPrivacy:"Privacy", fTerms:"Terms", fContact:"Contact" }
};
const DOC = {
  ar:{ h1:"اتصل بنا", intro:"أسئلة، اقتراحات، أخطاء، أو طلبات متعلقة ببياناتك؟ راسلنا وسنرد بأسرع ما نستطيع.", lbl:"البريد الإلكتروني", mail:"أرسل رسالة", copy:"نسخ العنوان", copied:"تم النسخ ✓",
    sections:[
     { h:"عند الإبلاغ عن مشكلة", ul:["ما الذي فعلته قبل ظهور المشكلة؟","ما الرسالة التي ظهرت لك (لقطة شاشة تساعد كثيراً)؟","نوع المتصفح والجهاز، وهل أنت زائر أم مسجّل؟","إن كانت المشكلة مع ملف: نوعه وحجمه تقريباً."] },
     { h:"طلبات الحساب والبيانات", ul:["<b>حذف الحساب:</b> أرسل رسالة بعنوان «حذف حسابي» من البريد الذي سجّلت به.","<b>حذف المحادثات:</b> يمكنك فعل ذلك بنفسك من الإعدادات.","<b>أسئلة الخصوصية:</b> اقرأ <a href=\"privacy.html\">سياسة الخصوصية</a> أولاً، ثم راسلنا إن بقي سؤال."] },
     { h:"اقتراحات", p:["أسرع طريقة لتقييم إجابة هي زرّا 👍 و👎 تحتها. وللأفكار الأكبر، راسلنا مباشرة."] } ] },
  en:{ h1:"Contact", intro:"Questions, suggestions, bugs, or requests about your data? Write to us and we will reply as soon as we can.", lbl:"Email", mail:"Send an email", copy:"Copy address", copied:"Copied ✓",
    sections:[
     { h:"When you report a problem", ul:["What did you do before it happened?","What message did you see (a screenshot helps a lot)?","Your browser and device, and whether you were a guest or signed in.","If it involved a file: its type and roughly its size."] },
     { h:"Account and data requests", ul:["<b>Delete your account:</b> email us with the subject “Delete my account”, from the address you registered with.","<b>Delete conversations:</b> you can do this yourself in Settings.","<b>Privacy questions:</b> read the <a href=\"privacy.html\">Privacy Policy</a> first, then write to us if something is still unclear."] },
     { h:"Suggestions", p:["The fastest way to rate an answer is the 👍 and 👎 buttons under it. For bigger ideas, email us directly."] } ] }
};
const el = (tag, cls, html) => { const n = document.createElement(tag); if(cls) n.className = cls; if(html !== undefined) n.innerHTML = html; return n; };
function render(){
  const lang = getLang(), c = COMMON[lang], d = DOC[lang];
  Object.keys(c).forEach(id => { const n = document.getElementById(id); if(n) n.textContent = c[id]; });
  document.getElementById('h1').textContent = d.h1; document.getElementById('intro').textContent = d.intro; document.getElementById('lbl').textContent = d.lbl;
  document.getElementById('mailBtn').textContent = d.mail; document.getElementById('mailBtn').href = 'mailto:' + EMAIL + '?subject=' + encodeURIComponent('ElectroRed AI');
  document.getElementById('copyBtn').textContent = d.copy;
  const box = document.getElementById('sections'); box.innerHTML = '';
  d.sections.forEach(s => { const sec = el('section'); sec.appendChild(el('h2', '', s.h)); (s.p || []).forEach(t => sec.appendChild(el('p', '', t))); if(s.ul){ const ul = el('ul'); s.ul.forEach(t => ul.appendChild(el('li', '', t))); sec.appendChild(ul); } box.appendChild(sec); });
  ElectroRed.applySession();
}
document.getElementById('copyBtn').addEventListener('click', async () => {
  const d = DOC[getLang()], b = document.getElementById('copyBtn');
  try { await navigator.clipboard.writeText(EMAIL); b.textContent = d.copied; setTimeout(() => { b.textContent = d.copy; }, 1800); } catch(e) { prompt(d.lbl, EMAIL); }
});
document.addEventListener('DOMContentLoaded', render);
document.getElementById('langToggle')?.addEventListener('click', () => setTimeout(render, 0));
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دارة — ابدأ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
<style>
  .center-page{min-height:100vh; min-height:100dvh; display:flex; align-items:center; justify-content:center;
    background: radial-gradient(circle at 20% 20%, rgba(79,168,125,.10), transparent 40%),
                radial-gradient(circle at 80% 75%, rgba(224,149,79,.10), transparent 40%), var(--bg);}
  .choice-card{text-align:center; padding:46px 40px; background:var(--surface); border:1px solid var(--line); border-radius:18px; box-shadow:0 30px 70px -30px rgba(0,0,0,.5); max-width:380px; width:92%;}
  .choice-card .logo{font-size:24px; margin-bottom:8px;}
  .choice-card .tagline{color:var(--ink-soft); font-size:14px; margin-bottom:30px;}
  .choice-btn{display:block; width:100%; padding:14px 20px; border-radius:10px; font-size:15px; font-weight:600; font-family:inherit; cursor:pointer; margin-bottom:12px; text-decoration:none;}
  .choice-btn.primary{background:var(--copper); color:#fff; border:none;}
  .choice-btn.primary:hover{background:var(--copper-deep);}
  .choice-btn.secondary{background:transparent; border:1px solid var(--line); color:var(--ink);}
  .choice-btn.secondary:hover{border-color:var(--ink-soft);}
  .back-link{display:inline-block; margin-top:4px; font-size:13px; color:var(--ink-soft); text-decoration:none;}
</style>
</head>
<body>
<div class="center-page">
  <div class="choice-card">
    <div class="logo">دارة</div>
    <div class="tagline" data-i="authTagline"></div>
    <a href="login.html" class="choice-btn primary" data-i="goLogin"></a>
    <a href="chat.html" class="choice-btn secondary" data-i="goGuest"></a>
    <a href="index.html" class="back-link" data-i="backHome"></a>
  </div>
</div>
<script src="assets/lang.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دارة — المحادثة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<style>
  .bubble.bot{text-align:start;}
  .bubble.bot :is(h1,h2,h3){margin:14px 0 6px; font-size:16px;}
  .bubble.bot p{margin:0 0 10px;}
  .bubble.bot p:last-child{margin-bottom:0;}
  .bubble.bot ul,.bubble.bot ol{margin:0 0 10px; padding-inline-start:22px;}
  .bubble.bot li{margin-bottom:4px;}
  .bubble.bot strong{color:var(--copper);}
  .bubble.bot code{font-family:'JetBrains Mono',monospace; font-size:13px;}
  .bubble.bot pre{background:#0B0D0C; border:1px solid var(--line); border-radius:8px; padding:12px 14px; overflow-x:auto; margin:0 0 10px; direction:ltr; text-align:left;}
  .bubble.bot pre code{background:none; color:#EDEFEA; padding:0;}
  .bubble.bot .katex{font-size:1.02em;}
  .bubble.bot hr{border:none; border-top:1px solid var(--line); margin:12px 0;}
  .auth-gate{position:fixed; inset:0; z-index:50; display:flex; align-items:center; justify-content:center;
    background:
      radial-gradient(circle at 20% 20%, rgba(79,168,125,.10), transparent 40%),
      radial-gradient(circle at 80% 75%, rgba(224,149,79,.10), transparent 40%),
      var(--bg);}
  .auth-gate.hidden{display:none;}
  .auth-card{text-align:center; padding:46px 42px; background:var(--surface); border:1px solid var(--line); border-radius:18px; box-shadow:0 30px 70px -30px rgba(0,0,0,.5); max-width:360px; width:92%;}
  .auth-card .mark{width:52px; height:52px; margin:0 auto 18px;}
  .auth-card .logo{font-size:24px; margin-bottom:6px;}
  .auth-card .tagline{color:var(--ink-soft); font-size:14px; margin-bottom:28px;}
  .google-btn{display:flex; align-items:center; gap:10px; justify-content:center; width:100%; background:var(--bg); border:1px solid var(--line); padding:13px 22px; border-radius:10px; cursor:pointer; font-family:inherit; font-size:15px; color:var(--ink); transition:border-color .15s, transform .1s;}
  .google-btn:hover{border-color:var(--copper);}
  .google-btn:active{transform:scale(.98);}
  .google-btn svg{width:18px; height:18px;}
  .auth-foot{margin-top:22px; font-size:12px; color:var(--ink-soft);}
  body.loading .chat-app{visibility:hidden;}
</style>
</head>
<body class="loading chat-page">
<div class="auth-gate" id="authGate">
  <div class="auth-card">
    <svg class="mark" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="2.4" fill="#E0954F"/><path d="M12 2v5.2M12 16.8V22M2 12h5.2M16.8 12H22M5 5l3.7 3.7M15.3 15.3L19 19M19 5l-3.7 3.7M8.7 15.3L5 19" stroke="var(--ink-soft)" stroke-width="1.4" stroke-linecap="round"/></svg>
    <div class="logo">دارة</div>
    <div class="tagline" data-i="authTagline"></div>
    <button class="google-btn" id="googleSignIn">
      <svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.5 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.5 6 29.5 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.5 16 18.9 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.5 6 29.5 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.3 0 10.1-1.8 13.9-5l-6.4-5.4C29.4 35.4 26.8 36 24 36c-5.2 0-9.6-3.5-11.2-8.3l-6.5 5C9.6 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.1-4 5.6l6.4 5.4C41.5 35.6 44 30.2 44 24c0-1.3-.1-2.7-.4-3.5z"/></svg>
      <span data-i="signIn">تسجيل الدخول بحساب Google</span>
    </button>
    <div class="auth-foot" data-i="authFoot"></div>
  </div>
</div>
<div class="chat-app">
  <aside class="sidebar" id="sidebar">
    <button class="btn-primary new-chat" data-i="startChat" onclick="newChat()"></button>
    <input class="search" data-i-ph="search" oninput="filterChats(this.value)">
    <div class="section-label" data-i="projects"></div>
    <div class="chat-item">⚡ مشروع تخرج</div>
    <div class="section-label" data-i="recent"></div>
    <div id="chatList"></div>
    <div class="sidebar-footer" onclick="location.href='settings.html'">
      <div class="avatar" id="avatarLetter">?</div>
      <div>
        <div style="font-size:14px; font-weight:600;" id="userName">—</div>
        <div style="font-size:12px; color:var(--ink-soft);" data-i="settings"></div>
      </div>
    </div>
  </aside>

  <main class="chat-main">
    <div class="chat-topbar">
      <button class="icon-btn" id="sidebarToggle">☰</button>
    </div>
    <div class="chat-scroll" id="chatScroll">
      <div class="chat-inner" id="chatInner">
        <div class="welcome" id="welcome">
          <h2 id="welcomeTitle" data-i="welcomeTitle"></h2>
          <p id="welcomeSub" data-i="welcomeSub"></p>
        </div>
      </div>
    </div>
    <div class="composer">
      <div class="composer-inner">
        <div class="composer-actions">
          <button class="icon-round" title="upload file" onclick="document.getElementById('fileInput').click()">📎</button>
          <input type="file" id="fileInput" style="display:none">
          <button class="icon-round" title="voice input" id="micBtn">🎤</button>
        </div>
        <textarea id="msgInput" rows="1" data-i-ph="placeholder" oninput="autoGrow(this)" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage();}"></textarea>
        <button class="icon-round send" onclick="sendMessage()">➤</button>
      </div>
      <div class="hint" id="disclaimer" data-i="disclaimer"></div>
    </div>
  </main>
</div>

<script src="assets/lang.js"></script>
<script type="module">
import { signInWithGoogle, watchAuth, createChat, watchUserChats, watchMessages, addMessage } from './assets/firebase.js';

let currentUser = null;
let currentChatId = null;
let unsubChats = null;
let unsubMessages = null;

document.getElementById('googleSignIn').addEventListener('click', async ()=>{
  try { await signInWithGoogle(); } catch(e){ alert('فشل تسجيل الدخول: ' + e.message); }
});

watchAuth(user => {
  currentUser = user;
  document.body.classList.remove('loading');
  const gate = document.getElementById('authGate');
  if(user){
    gate.classList.add('hidden');
    document.getElementById('userName').textContent = user.displayName || user.email;
    document.getElementById('avatarLetter').textContent = (user.displayName || user.email || '?').charAt(0).toUpperCase();
    if(unsubChats) unsubChats();
    unsubChats = watchUserChats(user.uid, renderChatList);
  } else {
    gate.classList.remove('hidden');
    if(unsubChats) unsubChats();
  }
});

window.autoGrow = function(el){ el.style.height='auto'; el.style.height=el.scrollHeight+'px'; };

document.getElementById('sidebarToggle').addEventListener('click', ()=>{
  if(window.innerWidth <= 820){
    document.getElementById('sidebar').classList.toggle('open');
  } else {
    document.querySelector('.chat-app').classList.toggle('sidebar-collapsed');
  }
});

window.newChat = function(){
  currentChatId = null;
  if(unsubMessages) unsubMessages();
  document.getElementById('chatInner').innerHTML = `
    <div class="welcome" id="welcome"><h2 id="welcomeTitle" data-i="welcomeTitle"></h2><p id="welcomeSub" data-i="welcomeSub"></p></div>`;
  applyLang();
  document.querySelectorAll('.chat-item').forEach(el=>el.classList.remove('active'));
};

let lastChats = [];
function renderChatList(chats){
  lastChats = chats;
  const list = document.getElementById('chatList');
  list.innerHTML = chats.map(c =>
    `<div class="chat-item ${c.id===currentChatId?'active':''}" data-id="${c.id}">${c.title}</div>`).join('') ||
    '<div class="chat-item" style="opacity:.5">—</div>';
  list.querySelectorAll('.chat-item').forEach(el=>{
    el.addEventListener('click', ()=> openChat(el.dataset.id));
  });
}
window.filterChats = function(q){
  document.querySelectorAll('.chat-item').forEach(el=>{
    el.style.display = el.textContent.includes(q) ? '' : 'none';
  });
};

function openChat(chatId){
  currentChatId = chatId;
  renderChatList(lastChats);
  const inner = document.getElementById('chatInner');
  inner.innerHTML = '';
  if(unsubMessages) unsubMessages();
  unsubMessages = watchMessages(chatId, msgs=>{
    inner.innerHTML = '';
    msgs.forEach(m => addBubble(m.role, m.text, false));
    document.getElementById('chatScroll').scrollTop = 999999;
  });
}

function renderBotContent(el, text){
  el.innerHTML = window.marked ? marked.parse(text || '', { breaks: true }) : (text || '');
  if(window.renderMathInElement){
    renderMathInElement(el, {
      delimiters: [
        { left: '$$', right: '$$', display: true },
        { left: '\\(', right: '\\)', display: false },
        { left: '$', right: '$', display: false }
      ],
      throwOnError: false
    });
  }
  if(window.hljs) el.querySelectorAll('pre code').forEach(block => hljs.highlightElement(block));
}

function addBubble(role, text, scroll = true){
  const inner = document.getElementById('chatInner');
  const welcome = document.getElementById('welcome');
  if(welcome) welcome.remove();
  const b = document.createElement('div');
  b.className = 'bubble ' + role;
  if(role === 'bot') renderBotContent(b, text); else b.textContent = text;
  inner.appendChild(b);
  if(scroll) document.getElementById('chatScroll').scrollTop = 999999;
  return b;
}

// Streams the reply token-by-token from /api/chat (Server-Sent Events / chunked response).
// The API route (api/chat.js) is responsible for picking a provider (Groq/Gemini),
// rotating keys, and forwarding the stream — this file just renders it.
window.sendMessage = async function(){
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if(!text || !currentUser) return;
  input.value = ''; autoGrow(input);

  if(!currentChatId){
    currentChatId = await createChat(currentUser.uid, text);
    openChat(currentChatId);
  }
  await addMessage(currentChatId, 'user', text);

  const botBubble = addBubble('bot', '');
  botBubble.innerHTML = '<span class="cursor-blink"></span>';

  try{
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ message: text, lang: getLang() })
    });
    if(!res.body) throw new Error('no stream');
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let full = '';
    while(true){
      const {done, value} = await reader.read();
      if(done) break;
      full += decoder.decode(value, {stream:true});
      renderBotContent(botBubble, full);
      document.getElementById('chatScroll').scrollTop = 999999;
    }
    await addMessage(currentChatId, 'bot', full);
  } catch(e){
    botBubble.textContent = '⚠️ تعذر الاتصال بالمساعد. (api/chat.js غير موصول بعد)';
  }
};
</script>
</body>
</html>

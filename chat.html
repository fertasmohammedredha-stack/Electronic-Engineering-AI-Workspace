<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دارة — المحادثة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<style>
  .bubble.bot{text-align:start;}
  .bubble.bot :is(h1,h2,h3){margin:14px 0 6px; font-size:16px;}
  .bubble.bot p{margin:0 0 10px;}
  .bubble.bot p:last-child{margin-bottom:0;}
  .bubble.bot ul,.bubble.bot ol{margin:0 0 10px; padding-inline-start:22px;}
  .bubble.bot li{margin-bottom:4px;}
  .bubble.bot strong{color:var(--copper);}
  .bubble.bot code{font-family:'JetBrains Mono',monospace; font-size:13px;}
  .bubble.bot pre{background:#0B0D0C; border:1px solid var(--line); border-radius:8px; padding:12px 14px; overflow-x:auto; margin:0 0 10px; direction:ltr; text-align:left;}
  .bubble.bot pre code{background:none; color:#EDEFEA; padding:0;}
  .bubble.bot .katex{font-size:1.02em;}
  .bubble.bot hr{border:none; border-top:1px solid var(--line); margin:12px 0;}
  body.loading .chat-app{visibility:hidden;}
  .guest-row{display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:8px; cursor:pointer; color:var(--ink-soft); font-size:13.5px;}
  .guest-row:hover{background:var(--bg); color:var(--ink);}
  .locked-hint{font-size:11px; color:var(--ink-soft); text-align:center; margin-top:2px;}
  .guest-banner{max-width:760px; margin:0 auto 12px; background:var(--surface); border:1px solid var(--copper); border-radius:12px; padding:14px 16px; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;}
  .guest-banner p{font-size:13.5px; color:var(--ink-soft);}
  .guest-banner.hidden{display:none;}
  textarea:disabled{opacity:.5;}
  .icon-round:disabled{opacity:.35; cursor:not-allowed;}
  .guest-countdown{display:flex; align-items:center; gap:6px; font-size:13px; color:var(--ink-soft); background:var(--surface); border:1px solid var(--line); padding:6px 12px; border-radius:20px;}
  .guest-countdown b{color:var(--copper); font-family:'JetBrains Mono',monospace;}
  .footer-guest-actions{display:flex; flex-direction:column; gap:6px;}
  .footer-guest-actions .guest-row{padding:9px 12px;}
  .msg-actions{display:flex; gap:4px; margin-top:-10px; margin-inline-start:4px;}
  html[dir="rtl"] .msg-actions{align-self:flex-end;}
  html[dir="ltr"] .msg-actions{align-self:flex-start;}
  .action-btn{border:none; background:transparent; font-size:13px; padding:4px 7px; border-radius:6px; cursor:pointer; opacity:.6; line-height:1;}
  .action-btn:hover{opacity:1; background:var(--surface);}
  .action-btn.active{opacity:1; background:var(--surface);}
  .image-preview{max-width:760px; margin:0 auto 10px; display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:8px 10px;}
  .image-preview.hidden{display:none;}
  .image-preview img{width:44px; height:44px; object-fit:cover; border-radius:6px;}
  .image-preview button{margin-inline-start:auto; background:none; border:none; color:var(--ink-soft); cursor:pointer; font-size:16px;}
  .bubble img.msg-img{max-width:100%; border-radius:8px; display:block; margin-bottom:8px;}
</style>
</head>
<body class="loading chat-page">
<div class="chat-app">
  <div class="sidebar-backdrop" id="sidebarBackdrop" onclick="setSidebarOpen(false)"></div>
  <aside class="sidebar" id="sidebar">
    <button class="btn-primary new-chat" data-i="startChat" onclick="newChat()"></button>
    <input class="search" data-i-ph="search" oninput="filterChats(this.value)">
    <div class="section-label" data-i="recent" id="recentLabel"></div>
    <div id="chatList"></div>
    <div id="guestNotice" class="locked-hint" data-i="guestSaveHint" style="display:none; padding:0 4px;"></div>
    <div class="sidebar-footer" id="footerLoggedIn" style="display:none;" onclick="location.href='settings.html'">
      <div class="avatar" id="avatarLetter">?</div>
      <div>
        <div style="font-size:14px; font-weight:600;" id="userName">—</div>
        <div style="font-size:12px; color:var(--ink-soft);" data-i="settings"></div>
      </div>
    </div>
    <div class="footer-guest-actions" id="footerGuest" style="display:none;">
      <div class="guest-row" onclick="doSignIn()">
        <div class="avatar" style="background:var(--copper); width:28px; height:28px; font-size:13px;">⚡</div>
        <span data-i="goLogin"></span>
      </div>
      <a href="index.html" class="guest-row" style="text-decoration:none;">
        <span style="width:28px; text-align:center;">←</span>
        <span data-i="guestBack"></span>
      </a>
    </div>
  </aside>

  <main class="chat-main">
    <div class="chat-topbar">
      <button class="icon-btn" id="sidebarToggle">☰</button>
      <div class="guest-countdown" id="guestCountdown" style="display:none;">⏳ <b id="guestRemaining">15</b></div>
    </div>
    <div class="chat-scroll" id="chatScroll">
      <div class="chat-inner" id="chatInner">
        <div class="welcome" id="welcome">
          <h2 id="welcomeTitle" data-i="welcomeTitle"></h2>
          <p id="welcomeSub" data-i="welcomeSub"></p>
        </div>
      </div>
    </div>
    <div class="composer">
      <div class="guest-banner hidden" id="guestBanner">
        <p data-i="guestLimitMsg"></p>
        <button class="btn-primary" style="padding:9px 18px; font-size:14px;" onclick="doSignIn()" data-i="goLogin"></button>
      </div>
      <div class="image-preview hidden" id="imagePreview">
        <img id="previewImg" alt="">
        <button type="button" id="removeImage">✕</button>
      </div>
      <div class="composer-inner">
        <div class="composer-actions">
          <button class="icon-round" id="fileBtn" title="upload image" onclick="document.getElementById('fileInput').click()">📎</button>
          <input type="file" id="fileInput" accept="image/*" style="display:none">
          <button class="icon-round" title="voice input" id="micBtn">🎤</button>
        </div>
        <textarea id="msgInput" rows="1" data-i-ph="placeholder" oninput="autoGrow(this)" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage();}"></textarea>
        <button class="icon-round send" onclick="sendMessage()">➤</button>
      </div>
      <div class="hint" id="disclaimer" data-i="disclaimer"></div>
    </div>
  </main>
</div>

<script src="assets/lang.js"></script>
<script type="module">
import { watchAuth, createChat, watchUserChats, watchMessages, addMessage, trackEvent } from './assets/firebase.js';

const GUEST_LIMIT = 15;
let currentUser = null;
let currentChatId = null;
let unsubChats = null;
let unsubMessages = null;

function getGuestChat(){ return JSON.parse(localStorage.getItem('guestChat') || '[]'); }
function saveGuestChat(arr){ localStorage.setItem('guestChat', JSON.stringify(arr)); }
// guestTotal persists across "New chat" — it's the lifetime guest limit, not tied to one conversation.
function guestQuestionCount(){ return parseInt(localStorage.getItem('guestTotal') || '0', 10); }
function incGuestTotal(){ localStorage.setItem('guestTotal', String(guestQuestionCount() + 1)); }

window.doSignIn = function(){ location.href = 'login.html'; };

function applyGuestUI(){
  document.getElementById('footerLoggedIn').style.display = 'none';
  document.getElementById('footerGuest').style.display = 'flex';
  document.getElementById('recentLabel').style.display = 'none';
  document.getElementById('chatList').style.display = 'none';
  document.getElementById('guestNotice').style.display = 'block';
  document.getElementById('fileBtn').disabled = true;
  document.getElementById('micBtn').disabled = true;
  const count = guestQuestionCount();
  const atLimit = count >= GUEST_LIMIT;
  document.getElementById('guestBanner').classList.toggle('hidden', !atLimit);
  document.getElementById('msgInput').disabled = atLimit;
  document.getElementById('guestCountdown').style.display = 'flex';
  document.getElementById('guestRemaining').textContent = Math.max(0, GUEST_LIMIT - count);
}
function applyAuthedUI(user){
  document.getElementById('footerLoggedIn').style.display = 'flex';
  document.getElementById('footerGuest').style.display = 'none';
  document.getElementById('recentLabel').style.display = '';
  document.getElementById('chatList').style.display = '';
  document.getElementById('guestNotice').style.display = 'none';
  document.getElementById('fileBtn').disabled = false;
  document.getElementById('micBtn').disabled = false;
  document.getElementById('guestBanner').classList.add('hidden');
  document.getElementById('msgInput').disabled = false;
  document.getElementById('guestCountdown').style.display = 'none';
  document.getElementById('userName').textContent = user.displayName || user.email;
  document.getElementById('avatarLetter').textContent = (user.displayName || user.email || '?').charAt(0).toUpperCase();
}

async function migrateGuestChatIfAny(uid){
  const guest = getGuestChat();
  if(!guest.length) return null;
  const firstUserMsg = guest.find(m => m.role === 'user')?.text || '';
  const newId = await createChat(uid, firstUserMsg);
  for(const m of guest) await addMessage(newId, m.role, m.text);
  saveGuestChat([]);
  localStorage.removeItem('guestTotal');
  return newId;
}

watchAuth(async user => {
  currentUser = user;
  document.body.classList.remove('loading');

  if(user){
    const migratedId = await migrateGuestChatIfAny(user.uid);
    applyAuthedUI(user);
    if(unsubChats) unsubChats();
    unsubChats = watchUserChats(user.uid, chats=>{
      renderChatList(chats);
      if(migratedId && !currentChatId) openChat(migratedId);
    });
  } else {
    if(unsubChats) unsubChats();
    applyGuestUI();
    const guest = getGuestChat();
    if(guest.length){
      document.getElementById('chatInner').innerHTML = '';
      guest.forEach(m => {
        const el = addBubble(m.role, m.text, false);
        if(m.role === 'bot') addMessageActions(el, m.text);
      });
      document.getElementById('chatScroll').scrollTop = 999999;
    }
  }
});

window.autoGrow = function(el){ el.style.height='auto'; el.style.height=el.scrollHeight+'px'; };

window.setSidebarOpen = function(open){
  document.getElementById('sidebar').classList.toggle('open', open);
  document.getElementById('sidebarBackdrop').classList.toggle('show', open);
};

document.getElementById('sidebarToggle').addEventListener('click', ()=>{
  if(window.innerWidth <= 820){
    setSidebarOpen(!document.getElementById('sidebar').classList.contains('open'));
  } else {
    document.querySelector('.chat-app').classList.toggle('sidebar-collapsed');
  }
});

// Touch gestures (mobile only): swipe the open sidebar sideways to close it,
// and swipe inward from the screen edge to open it — same as ChatGPT's app.
(function(){
  const sidebar = document.getElementById('sidebar');
  let startX = null, lastX = null, draggingSidebar = false, edgeStartX = null;
  const isRTL = ()=> document.documentElement.dir === 'rtl';

  sidebar.addEventListener('touchstart', e=>{
    if(window.innerWidth > 820) return;
    draggingSidebar = true; startX = lastX = e.touches[0].clientX;
    sidebar.style.transition = 'none';
  }, {passive:true});
  sidebar.addEventListener('touchmove', e=>{
    if(!draggingSidebar) return;
    lastX = e.touches[0].clientX;
    let delta = lastX - startX;
    delta = isRTL() ? Math.max(0, delta) : Math.min(0, delta); // only allow dragging toward "closed"
    sidebar.style.transform = `translateX(${delta}px)`;
  }, {passive:true});
  sidebar.addEventListener('touchend', ()=>{
    if(!draggingSidebar) return;
    draggingSidebar = false;
    sidebar.style.transition = '';
    sidebar.style.transform = '';
    const delta = lastX - startX;
    if(isRTL() ? delta > 60 : delta < -60) setSidebarOpen(false);
    startX = lastX = null;
  });

  document.addEventListener('touchstart', e=>{
    if(window.innerWidth > 820 || sidebar.classList.contains('open')) { edgeStartX = null; return; }
    const x = e.touches[0].clientX;
    const fromEdge = isRTL() ? x > window.innerWidth - 24 : x < 24;
    edgeStartX = fromEdge ? x : null;
  }, {passive:true});
  document.addEventListener('touchmove', e=>{
    if(edgeStartX === null) return;
    const delta = e.touches[0].clientX - edgeStartX;
    if(Math.abs(delta) > 40){ setSidebarOpen(true); edgeStartX = null; }
  }, {passive:true});
})();

window.newChat = function(){
  currentChatId = null;
  if(unsubMessages) unsubMessages();
  if(!currentUser) saveGuestChat([]);
  document.getElementById('chatInner').innerHTML = `
    <div class="welcome" id="welcome"><h2 id="welcomeTitle" data-i="welcomeTitle"></h2><p id="welcomeSub" data-i="welcomeSub"></p></div>`;
  applyLang();
  document.querySelectorAll('.chat-item').forEach(el=>el.classList.remove('active'));
  if(!currentUser) applyGuestUI();
};

let lastChats = [];
function renderChatList(chats){
  lastChats = chats;
  const list = document.getElementById('chatList');
  list.innerHTML = chats.map(c =>
    `<div class="chat-item ${c.id===currentChatId?'active':''}" data-id="${c.id}">${c.title}</div>`).join('') ||
    '<div class="chat-item" style="opacity:.5">—</div>';
  list.querySelectorAll('.chat-item').forEach(el=>{
    el.addEventListener('click', ()=> openChat(el.dataset.id));
  });
}
window.filterChats = function(q){
  document.querySelectorAll('.chat-item').forEach(el=>{
    el.style.display = el.textContent.includes(q) ? '' : 'none';
  });
};

function openChat(chatId){
  currentChatId = chatId;
  renderChatList(lastChats);
  const inner = document.getElementById('chatInner');
  inner.innerHTML = '';
  if(unsubMessages) unsubMessages();
  unsubMessages = watchMessages(chatId, msgs=>{
    inner.innerHTML = '';
    msgs.forEach(m => {
      const el = addBubble(m.role, m.text, false, m.image || null);
      if(m.role === 'bot') addMessageActions(el, m.text);
    });
    document.getElementById('chatScroll').scrollTop = 999999;
  });
}

function renderBotContent(el, text){
  el.innerHTML = window.marked ? marked.parse(text || '', { breaks: true }) : (text || '');
  if(window.renderMathInElement){
    renderMathInElement(el, {
      delimiters: [
        { left: '$$', right: '$$', display: true },
        { left: '\\(', right: '\\)', display: false },
        { left: '$', right: '$', display: false }
      ],
      throwOnError: false
    });
  }
  if(window.hljs) el.querySelectorAll('pre code').forEach(block => hljs.highlightElement(block));
}

function addMessageActions(bubbleEl, text){
  const row = document.createElement('div');
  row.className = 'msg-actions';
  row.innerHTML = `
    <button class="action-btn" data-action="copy" title="Copy">📋</button>
    <button class="action-btn" data-action="up" title="Good response">👍</button>
    <button class="action-btn" data-action="down" title="Bad response">👎</button>`;
  row.querySelector('[data-action="copy"]').addEventListener('click', (e)=>{
    navigator.clipboard.writeText(text);
    e.currentTarget.textContent = '✅';
    setTimeout(()=> e.currentTarget.textContent = '📋', 1200);
  });
  row.querySelector('[data-action="up"]').addEventListener('click', (e)=> toggleFeedback(e.currentTarget, row, 'up'));
  row.querySelector('[data-action="down"]').addEventListener('click', (e)=> toggleFeedback(e.currentTarget, row, 'down'));
  bubbleEl.insertAdjacentElement('afterend', row);
}
function toggleFeedback(btn, row, kind){
  const other = row.querySelector(`[data-action="${kind==='up'?'down':'up'}"]`);
  const isActive = btn.classList.contains('active');
  other.classList.remove('active');
  btn.classList.toggle('active', !isActive);
}

function addBubble(role, text, scroll = true, imageUrl = null){
  const inner = document.getElementById('chatInner');
  const welcome = document.getElementById('welcome');
  if(welcome) welcome.remove();
  const b = document.createElement('div');
  b.className = 'bubble ' + role;
  if(role === 'bot'){
    renderBotContent(b, text);
  } else {
    if(imageUrl){ const img = document.createElement('img'); img.src = imageUrl; img.className = 'msg-img'; b.appendChild(img); }
    if(text){ const t = document.createElement('div'); t.textContent = text; b.appendChild(t); }
  }
  inner.appendChild(b);
  if(scroll) document.getElementById('chatScroll').scrollTop = 999999;
  return b;
}

// ---- Image upload (logged-in users only; the composer button is disabled for guests) ----
let pendingImage = null; // { dataUrl, base64, mimeType }

document.getElementById('fileInput').addEventListener('change', (e)=>{
  const file = e.target.files[0];
  e.target.value = '';
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    const img = new Image();
    img.onload = ()=>{
      const maxDim = 1024;
      let { width, height } = img;
      if(width > maxDim || height > maxDim){
        const scale = maxDim / Math.max(width, height);
        width = Math.round(width * scale); height = Math.round(height * scale);
      }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
      pendingImage = { dataUrl, base64: dataUrl.split(',')[1], mimeType: 'image/jpeg' };
      document.getElementById('previewImg').src = dataUrl;
      document.getElementById('imagePreview').classList.remove('hidden');
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
});
document.getElementById('removeImage').addEventListener('click', ()=>{
  pendingImage = null;
  document.getElementById('imagePreview').classList.add('hidden');
});

// Streams the reply token-by-token from /api/chat (Server-Sent Events / chunked response).
// The API route (api/chat.js) is responsible for picking a provider (Groq/Gemini),
// rotating keys, and forwarding the stream — this file just renders it.
window.sendMessage = async function(){
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  const image = pendingImage; // snapshot — cleared below before the request goes out
  if((!text && !image) || input.disabled) return;
  if(!currentUser && guestQuestionCount() >= GUEST_LIMIT) return;

  input.value = ''; autoGrow(input);
  pendingImage = null;
  document.getElementById('imagePreview').classList.add('hidden');
  addBubble('user', text, true, image ? image.dataUrl : null);
  trackEvent('message_sent');

  const titleText = text || 'صورة 📎';
  if(currentUser){
    if(!currentChatId){ currentChatId = await createChat(currentUser.uid, titleText); openChat(currentChatId); }
    await addMessage(currentChatId, 'user', text, image ? image.dataUrl : null);
  } else {
    const g = getGuestChat(); g.push({role:'user', text}); saveGuestChat(g);
    incGuestTotal();
    applyGuestUI(); // update the countdown immediately, not just at the limit
  }

  const botBubble = addBubble('bot', '');
  botBubble.innerHTML = '<span class="cursor-blink"></span>';

  try{
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        message: text, lang: getLang(),
        image: image ? { data: image.base64, mimeType: image.mimeType } : undefined
      })
    });
    if(!res.body) throw new Error('no stream');
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let full = '';
    while(true){
      const {done, value} = await reader.read();
      if(done) break;
      full += decoder.decode(value, {stream:true});
      renderBotContent(botBubble, full);
      document.getElementById('chatScroll').scrollTop = 999999;
    }
    if(currentUser){
      await addMessage(currentChatId, 'bot', full);
    } else {
      const g = getGuestChat(); g.push({role:'bot', text: full}); saveGuestChat(g);
    }
    addMessageActions(botBubble, full);
    trackEvent('ai_response_success');
  } catch(e){
    botBubble.textContent = '⚠️ تعذر الاتصال بالمساعد.';
    trackEvent('ai_response_error', { error: String(e.message || e).slice(0, 100) });
  }
};
</script>
</body>
</html>

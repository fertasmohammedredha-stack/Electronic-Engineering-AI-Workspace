  .bubble.bot p{margin:0 0 10px;}

  .action-btn.active{opacity:1; background:var(--surface);}

  .bubble.user.editing{width:min(560px,92%); max-width:92%;}
  .edit-area{width:100%; resize:vertical; background:transparent; color:inherit; border:1px solid color-mix(in srgb, currentColor 45%, transparent); border-radius:8px; padding:8px 10px; font:inherit; outline:none;}
  .edit-bar{display:flex; gap:8px; justify-content:flex-end; margin-top:8px;}
  .edit-bar button{border:none; border-radius:7px; padding:6px 14px; font:inherit; font-size:13px; cursor:pointer;}

  <main class="chat-main">

<script src="assets/lang.js"></script>
<script type="module">
import { watchAuth, createChat, watchUserChats, watchMessages, addMessage, trackEvent, togglePinChat, renameChat, deleteChat, getIdToken, setMessageFeedback, deleteMessages } from './assets/firebase.js';

const GUEST_LIMIT = 15;
let currentUser = null;
let currentChatId = null;
let unsubChats = null;
let unsubMessages = null;
let isStreaming = false;     // true while a reply is being written into the page
let skippedSnapshot = null;  // newest Firestore snapshot that arrived mid-reply (drawn once the reply is done)
let currentMsgs = [];        // latest saved messages of the open chat, WITH their Firestore ids
let lastTurn = null;         // {text, attachment, chatId} of the last completed send — lets "regenerate" re-send the exact original file
let historyForApi = []; // {role:'user'|'bot', text} — the conversation memory sent with each request (server trims it to its own budget)

// Very long chats: keep the opening exchange (usually the original problem) + the newest messages.
function capHistory(arr, max = 60){
  return arr.length <= max ? arr : [...arr.slice(0, 2), ...arr.slice(-(max - 2))];
}
// What the AI should remember about a student message — including a copy of an attached
// file's text, so follow-up questions about that file still work later in the chat.
function memoryTextFor(text, att){
  if(!att) return text;
  const base = text ? text + '\n\n' : '';
  if(att.kind === 'text') return base + `[Attached file: ${att.name}]\n` + (att.text || '').slice(0, 5000);
  return base + `[The student attached ${att.kind === 'pdf' ? 'a PDF' : 'an image'}: ${att.name || ''}]`;
}

function getGuestChat(){ return JSON.parse(localStorage.getItem('guestChat') || '[]'); }
function saveGuestChat(arr){ localStorage.setItem('guestChat', JSON.stringify(arr)); }
// guestTotal persists across "New chat" — it's the lifetime guest limit, not tied to one conversation.
function guestQuestionCount(){ return parseInt(localStorage.getItem('guestTotal') || '0', 10); }
function incGuestTotal(){ localStorage.setItem('guestTotal', String(guestQuestionCount() + 1)); }

window.doSignIn = function(){ location.href = 'login.html'; };

function applyGuestUI(){
  document.getElementById('footerLoggedIn').style.display = 'none';
  document.getElementById('footerGuest').style.display = 'flex';
  document.getElementById('recentLabel').style.display = 'none';
  document.getElementById('chatList').style.display = 'none';
  document.getElementById('guestNotice').style.display = 'block';
  document.getElementById('fileBtn').disabled = true;
  document.getElementById('micBtn').disabled = true;
  const count = guestQuestionCount();
  const atLimit = count >= GUEST_LIMIT;
  document.getElementById('guestBanner').classList.toggle('hidden', !atLimit);
  document.getElementById('msgInput').disabled = atLimit;
  document.getElementById('guestCountdown').style.display = 'flex';
  document.getElementById('guestRemaining').textContent = Math.max(0, GUEST_LIMIT - count);
}
function applyAuthedUI(user){
  document.getElementById('footerLoggedIn').style.display = 'flex';
  document.getElementById('footerGuest').style.display = 'none';
  document.getElementById('recentLabel').style.display = '';
  document.getElementById('chatList').style.display = '';
  document.getElementById('guestNotice').style.display = 'none';
  document.getElementById('fileBtn').disabled = false;
  document.getElementById('micBtn').disabled = false;
  document.getElementById('guestBanner').classList.add('hidden');
  document.getElementById('msgInput').disabled = false;
  document.getElementById('guestCountdown').style.display = 'none';
  document.getElementById('userName').textContent = user.displayName || user.email;
  document.getElementById('avatarLetter').textContent = (user.displayName || user.email || '?').charAt(0).toUpperCase();
}

async function migrateGuestChatIfAny(uid){
  const guest = getGuestChat();
  if(!guest.length) return null;
  const firstUserMsg = guest.find(m => m.role === 'user')?.text || '';
  const newId = await createChat(uid, firstUserMsg);
  for(const m of guest) await addMessage(newId, m.role, m.text);
  saveGuestChat([]);
  localStorage.removeItem('guestTotal');
  return newId;
}

watchAuth(async user => {
  currentUser = user;
  document.body.classList.remove('loading');

  if(user){
    const migratedId = await migrateGuestChatIfAny(user.uid);
    applyAuthedUI(user);
    if(unsubChats) unsubChats();
    unsubChats = watchUserChats(user.uid, chats=>{
      renderChatList(chats);
      if(migratedId && !currentChatId){
        openChat(migratedId);
      } else if(!currentChatId){
        // Restore whatever chat was open before (e.g. before navigating to
        // Settings to change language) instead of always landing on a blank one.
        const lastId = localStorage.getItem('lastOpenChat');
        if(lastId && chats.some(c => c.id === lastId)) openChat(lastId);
      }
    });
  } else {
    if(unsubChats) unsubChats();
    applyGuestUI();
    const guest = getGuestChat();
    if(guest.length){
      document.getElementById('chatInner').innerHTML = '';
      guest.forEach((m, i) => {
        const el = addBubble(m.role, m.text, false);
        if(m.role === 'bot') addMessageActions(el, m.text, { isLast: i === guest.length - 1 });
        else addUserActions(el, m.text, { guestIndex: i, canEdit: true });
      });
      historyForApi = guest.map(m => ({ role: m.role, text: m.text }));
      document.getElementById('chatScroll').scrollTop = 999999;
    }
  }
});

window.autoGrow = function(el){ el.style.height='auto'; el.style.height=el.scrollHeight+'px'; };

// ---- Voice input (Web Speech API — free, built into Chrome/Edge/Safari; no server involved) ----
(function(){
  const micBtn = document.getElementById('micBtn');
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SpeechRecognition){ micBtn.style.display = 'none'; return; } // unsupported browser — hide rather than show a dead button
  const recog = new SpeechRecognition();
  recog.interimResults = false;
  recog.continuous = false;
  let listening = false;

  micBtn.addEventListener('click', ()=>{
    if(micBtn.disabled) return;
    if(listening){ recog.stop(); return; }
    recog.lang = getLang() === 'ar' ? 'ar-SA' : 'en-US';
    try { recog.start(); } catch(e){}
  });
  recog.addEventListener('start', ()=>{ listening = true; micBtn.classList.add('active'); micBtn.textContent = '⏹️'; });
  recog.addEventListener('end', ()=>{ listening = false; micBtn.classList.remove('active'); micBtn.textContent = '🎤'; });
  recog.addEventListener('result', (e)=>{
    const transcript = e.results[0][0].transcript;
    const input = document.getElementById('msgInput');
    input.value = (input.value ? input.value + ' ' : '') + transcript;
    autoGrow(input);
  });
  recog.addEventListener('error', ()=>{ listening = false; micBtn.classList.remove('active'); micBtn.textContent = '🎤'; });
})();

window.setSidebarOpen = function(open){
  document.getElementById('sidebar').classList.toggle('open', open);
  document.getElementById('sidebarBackdrop').classList.toggle('show', open);
};

document.getElementById('sidebarToggle').addEventListener('click', ()=>{
  if(window.innerWidth <= 820){
    setSidebarOpen(!document.getElementById('sidebar').classList.contains('open'));
  } else {
    document.querySelector('.chat-app').classList.toggle('sidebar-collapsed');
  }
});

// Touch gestures (mobile only): swipe the open sidebar sideways to close it,
// and swipe inward from the screen edge to open it — same as ChatGPT's app.
(function(){
  const sidebar = document.getElementById('sidebar');
  let startX = null, lastX = null, draggingSidebar = false, edgeStartX = null;
  const isRTL = ()=> document.documentElement.dir === 'rtl';

  sidebar.addEventListener('touchstart', e=>{
    if(window.innerWidth > 820) return;
    draggingSidebar = true; startX = lastX = e.touches[0].clientX;
    sidebar.style.transition = 'none';
  }, {passive:true});
  sidebar.addEventListener('touchmove', e=>{
    if(!draggingSidebar) return;
    lastX = e.touches[0].clientX;
    let delta = lastX - startX;
    delta = isRTL() ? Math.max(0, delta) : Math.min(0, delta); // only allow dragging toward "closed"
    sidebar.style.transform = `translateX(${delta}px)`;
  }, {passive:true});
  sidebar.addEventListener('touchend', ()=>{
    if(!draggingSidebar) return;
    draggingSidebar = false;
    sidebar.style.transition = '';
    sidebar.style.transform = '';
    const delta = lastX - startX;
    if(isRTL() ? delta > 60 : delta < -60) setSidebarOpen(false);
    startX = lastX = null;
  });

  document.addEventListener('touchstart', e=>{
    if(window.innerWidth > 820 || sidebar.classList.contains('open')) { edgeStartX = null; return; }
    const x = e.touches[0].clientX;
    const fromEdge = isRTL() ? x > window.innerWidth - 24 : x < 24;
    edgeStartX = fromEdge ? x : null;
  }, {passive:true});
  document.addEventListener('touchmove', e=>{
    if(edgeStartX === null) return;
    const delta = e.touches[0].clientX - edgeStartX;
    if(Math.abs(delta) > 40){ setSidebarOpen(true); edgeStartX = null; }
  }, {passive:true});
})();

window.newChat = function(){
  currentChatId = null;
  localStorage.removeItem('lastOpenChat');
  if(unsubMessages) unsubMessages();
  if(!currentUser) saveGuestChat([]);
  historyForApi = []; currentMsgs = []; lastTurn = null;
  document.getElementById('chatInner').innerHTML = `
    <div class="welcome" id="welcome"><h2 id="welcomeTitle" data-i="welcomeTitle"></h2><p id="welcomeSub" data-i="welcomeSub"></p></div>`;
  applyLang();
  document.querySelectorAll('.chat-item').forEach(el=>el.classList.remove('active'));
  if(!currentUser) applyGuestUI();
};

let lastChats = [];
function renderChatList(chats){
  lastChats = chats;
  const sorted = [...chats].sort((a, b) => (b.pinned?1:0) - (a.pinned?1:0));
  const list = document.getElementById('chatList');
  list.innerHTML = sorted.map(c => `
    <div class="chat-item ${c.id===currentChatId?'active':''}" data-id="${c.id}">
      <span class="chat-item-title">${c.pinned ? '📌 ' : ''}${escapeHtml(c.title)}</span>
      <button type="button" class="chat-item-menu-btn" data-id="${c.id}">⋮</button>
    </div>`).join('') || '<div class="chat-item" style="opacity:.5">—</div>';

  list.querySelectorAll('.chat-item-title').forEach(el=>{
    el.addEventListener('click', ()=> openChat(el.closest('.chat-item').dataset.id));
  });
  list.querySelectorAll('.chat-item-menu-btn').forEach(btn=>{
    btn.addEventListener('click', (e)=>{ e.stopPropagation(); openChatMenu(btn.dataset.id, btn); });
  });
}
function escapeHtml(s){ const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }

let openMenuEl = null;
function closeChatMenu(){ if(openMenuEl){ openMenuEl.remove(); openMenuEl = null; } }
document.addEventListener('click', closeChatMenu);

function openChatMenu(chatId, anchorBtn){
  closeChatMenu();
  const chat = lastChats.find(c => c.id === chatId);
  if(!chat) return;
  const menu = document.createElement('div');
  menu.className = 'chat-menu';
  const pinLabel = chat.pinned ? (getLang()==='ar'?'إلغاء التثبيت':'Unpin') : (getLang()==='ar'?'تثبيت':'Pin');
  menu.innerHTML = `
    <button type="button" data-act="pin">📌 ${pinLabel}</button>
    <button type="button" data-act="rename">✏️ ${getLang()==='ar'?'إعادة تسمية':'Rename'}</button>
    <button type="button" data-act="delete" class="danger">🗑️ ${getLang()==='ar'?'حذف':'Delete'}</button>`;
  anchorBtn.parentElement.appendChild(menu);
  openMenuEl = menu;

  menu.querySelector('[data-act="pin"]').addEventListener('click', async (e)=>{
    e.stopPropagation(); closeChatMenu();
    try { await togglePinChat(chatId, !chat.pinned); }
    catch(err){ console.error('Pin failed:', err); alert(getLang()==='ar' ? 'تعذر تثبيت المحادثة.' : "Couldn't pin the chat."); }
  });
  menu.querySelector('[data-act="rename"]').addEventListener('click', (e)=>{
    e.stopPropagation(); closeChatMenu();
    const titleEl = anchorBtn.parentElement.querySelector('.chat-item-title');
    const input = document.createElement('input');
    input.className = 'chat-rename-input'; input.value = chat.title;
    titleEl.replaceWith(input);
    input.focus(); input.select();
    const save = async ()=>{
      const val = input.value.trim();
      if(val && val !== chat.title){
        try { await renameChat(chatId, val.slice(0, 60)); }
        catch(err){ console.error('Rename failed:', err); alert(getLang()==='ar' ? 'تعذرت إعادة التسمية.' : "Couldn't rename the chat."); }
      }
    };
    input.addEventListener('keydown', ev=>{ if(ev.key==='Enter') input.blur(); if(ev.key==='Escape'){ input.value = chat.title; input.blur(); } });
    input.addEventListener('blur', save, { once:true });
  });
  menu.querySelector('[data-act="delete"]').addEventListener('click', async (e)=>{
    e.stopPropagation(); closeChatMenu();
    if(!confirm(getLang()==='ar' ? 'حذف هذه المحادثة؟' : 'Delete this chat?')) return;
    try {
      await deleteChat(chatId);
      if(chatId === currentChatId) newChat();
    } catch(err){
      console.error('Delete chat failed:', err);
      alert(getLang()==='ar' ? 'تعذر حذف المحادثة. حاول مرة ثانية.' : "Couldn't delete the chat. Please try again.");
    }
  });
}
window.filterChats = function(q){
  document.querySelectorAll('.chat-item').forEach(el=>{
    el.style.display = el.textContent.includes(q) ? '' : 'none';
  });
};

function renderMessages(msgs){
  const inner = document.getElementById('chatInner');
  inner.innerHTML = '';
  msgs.forEach((m, i) => {
    const att = m.attachment || (m.image ? { kind:'image', dataUrl: m.image } : null);
    const el = addBubble(m.role, m.text, false, att);
    if(m.role === 'bot') addMessageActions(el, m.text, { id: m.id, feedback: m.feedback, isLast: i === msgs.length - 1 });
    else addUserActions(el, m.text, { id: m.id, canEdit: !att });
  });
  document.getElementById('chatScroll').scrollTop = 999999;
}
// What the AI remembers of a saved chat. A user message that carried a file stores a "memory"
// copy (typed text + the file's extracted text) so follow-up questions about the file still work.
function historyFromMsgs(msgs){
  return msgs.map(m => {
    const marker = m.attachment ? ' [attachment: ' + (m.attachment.name || m.attachment.kind) + ']' : (m.image ? ' [image attached]' : '');
    return { role: m.role, text: m.memory || ((m.text || '') + marker) };
  });
}
function rebuildHistory(msgs){ historyForApi = capHistory(historyFromMsgs(msgs)); }

// keepDom: used when a brand-new chat is created mid-send, so the bubbles already on screen aren't wiped.
function openChat(chatId, keepDom = false){
  currentChatId = chatId;
  localStorage.setItem('lastOpenChat', chatId);
  renderChatList(lastChats);
  if(!keepDom) document.getElementById('chatInner').innerHTML = '';
  if(unsubMessages) unsubMessages();
  unsubMessages = watchMessages(chatId, msgs => {
    currentMsgs = msgs;
    rebuildHistory(msgs);
    // Redrawing the chat while a reply is streaming would wipe the in-flight bubble, so hold the update.
    if(isStreaming){ skippedSnapshot = msgs; return; }
    renderMessages(msgs);
  });
}

// Math must be shielded from the Markdown parser: marked treats "_" as emphasis
// and eats backslashes before "{", "}", "\\" etc., which wrecks multi-line
// $$...$$ equations before KaTeX ever sees them. So: pull every math span out
// into a placeholder, run Markdown on the rest, then put the math back and
// render it with KaTeX directly.
function renderBotContent(el, text){
  const math = [];
  const stash = (tex, display) => { math.push({ tex, display }); return `@@MATH${math.length - 1}@@`; };
  let src = text || '';
  src = src.replace(/\$\$([\s\S]+?)\$\$/g, (_, m) => stash(m, true));            // $$ ... $$ (multi-line ok)
  src = src.replace(/\\\[([\s\S]+?)\\\]/g, (_, m) => stash(m, true));            // \[ ... \]
  src = src.replace(/\\\(([\s\S]+?)\\\)/g, (_, m) => stash(m, false));           // \( ... \)
  src = src.replace(/\$([^\s$](?:[^\n$]*?[^\s$])?)\$/g, (_, m) => stash(m, false)); // $ ... $ (one line)

  let html = window.marked ? marked.parse(src, { breaks: true }) : escapeHtml(src);
  html = html.replace(/@@MATH(\d+)@@/g, (_, i) => {
    const { tex, display } = math[+i];
    if(!window.katex) return escapeHtml(tex);
    try { return katex.renderToString(tex.trim(), { displayMode: display, throwOnError: false }); }
    catch(e){ return escapeHtml(tex); }
  });
  el.innerHTML = html;
  if(window.hljs) el.querySelectorAll('pre code').forEach(block => hljs.highlightElement(block));
}

const L = (ar, en) => getLang() === 'ar' ? ar : en;

function copyText(text, btn){
  if(navigator.clipboard) navigator.clipboard.writeText(text);
  const old = btn.textContent; btn.textContent = '✅';
  setTimeout(() => { btn.textContent = old; }, 1200);
}

// Under every AI reply: copy, 👍, 👎 — and 🔄 on the newest reply only.
// meta: { id (Firestore message id), feedback ('up'|'down'), isLast }
function addMessageActions(bubbleEl, text, meta = {}){
  const row = document.createElement('div');
  row.className = 'msg-actions';
  const fb = meta.feedback;
  row.innerHTML =
    '<button class="action-btn" data-action="copy" title="' + L('نسخ', 'Copy') + '">📋</button>' +
    '<button class="action-btn' + (fb === 'up' ? ' active' : '') + '" data-action="up" title="' + L('رد جيد', 'Good response') + '">👍</button>' +
    '<button class="action-btn' + (fb === 'down' ? ' active' : '') + '" data-action="down" title="' + L('رد سيئ', 'Bad response') + '">👎</button>' +
    (meta.isLast ? '<button class="action-btn regen-btn" data-action="regen" title="' + L('إعادة توليد', 'Regenerate') + '">🔄</button>' : '');
  row.querySelector('[data-action="copy"]').addEventListener('click', e => copyText(text, e.currentTarget));
  ['up', 'down'].forEach(kind => row.querySelector('[data-action="' + kind + '"]').addEventListener('click', e => onFeedback(e.currentTarget, row, kind, meta.id)));
  const regen = row.querySelector('[data-action="regen"]');
  if(regen) regen.addEventListener('click', () => regenerateLast());
  bubbleEl.insertAdjacentElement('afterend', row);
  return row;
}

// 👍/👎: toggles, is counted in Analytics, and (for saved chats) is stored on the message itself.
function onFeedback(btn, row, kind, messageId){
  const other = row.querySelector('[data-action="' + (kind === 'up' ? 'down' : 'up') + '"]');
  const turnedOn = !btn.classList.contains('active');
  other.classList.remove('active');
  btn.classList.toggle('active', turnedOn);
  const rating = turnedOn ? kind : null;
  trackEvent('message_feedback', { rating: rating || 'cleared' });
  if(currentUser && currentChatId && messageId){
    setMessageFeedback(currentChatId, messageId, rating).catch(err => console.error('Saving the rating failed:', err));
  }
}

// Under the student's own messages: copy, and ✏️ edit (text-only messages).
// meta: { id | guestIndex, canEdit }
function addUserActions(bubbleEl, text, meta = {}){
  if(!text) return null;
  const row = document.createElement('div');
  row.className = 'msg-actions user-actions';
  row.innerHTML =
    '<button class="action-btn" data-action="copy" title="' + L('نسخ', 'Copy') + '">📋</button>' +
    (meta.canEdit ? '<button class="action-btn" data-action="edit" title="' + L('تعديل', 'Edit') + '">✏️</button>' : '');
  row.querySelector('[data-action="copy"]').addEventListener('click', e => copyText(text, e.currentTarget));
  const edit = row.querySelector('[data-action="edit"]');
  if(edit) edit.addEventListener('click', () => startEdit(bubbleEl, row, text, meta));
  bubbleEl.insertAdjacentElement('afterend', row);
  return row;
}

// ---- Edit my message: inline editor, then (after confirmation) everything from that
// message onward is replaced by a fresh turn built on the edited text. ----
function startEdit(bubbleEl, row, original, meta){
  if(isStreaming) return;
  row.style.display = 'none';
  bubbleEl.classList.add('editing');
  bubbleEl.innerHTML = '';
  const ta = document.createElement('textarea');
  ta.className = 'edit-area'; ta.value = original;
  ta.rows = Math.min(8, Math.max(2, original.split('\n').length));
  const bar = document.createElement('div'); bar.className = 'edit-bar';
  const cancel = document.createElement('button'); cancel.type = 'button'; cancel.className = 'edit-cancel'; cancel.textContent = L('إلغاء', 'Cancel');
  const save = document.createElement('button'); save.type = 'button'; save.className = 'edit-save'; save.textContent = L('حفظ وإرسال', 'Save & send');
  bar.append(cancel, save);
  bubbleEl.append(ta, bar);
  ta.focus();

  const restore = () => {
    bubbleEl.classList.remove('editing'); bubbleEl.innerHTML = '';
    const t = document.createElement('div'); t.textContent = original; bubbleEl.appendChild(t);
    row.style.display = '';
  };
  cancel.addEventListener('click', restore);
  save.addEventListener('click', () => {
    const newText = ta.value.trim();
    if(!newText || newText === original){ restore(); return; }
    if(newText.length > MAX_MESSAGE_CHARS){
      alert(L('الرسالة طويلة جداً (الحد ' + MAX_MESSAGE_CHARS + ' حرف).', 'The message is too long (limit ' + MAX_MESSAGE_CHARS + ' characters).'));
      return;
    }
    commitEdit(bubbleEl, newText, meta, restore);
  });
}

async function commitEdit(bubbleEl, newText, meta, restore){
  if(isStreaming) return;
  if(!confirm(L('تعديل هذه الرسالة يحذف كل ما بعدها ويعيد توليد الرد. متابعة؟', 'Editing this message deletes everything after it and regenerates the reply. Continue?'))) return;
  let before;
  if(currentUser){
    const idx = currentMsgs.findIndex(m => m.id === meta.id);
    if(idx < 0){ restore(); return; }
    before = currentMsgs.slice(0, idx);
    try { await deleteMessages(currentChatId, currentMsgs.slice(idx).map(m => m.id)); }
    catch(err){
      console.error('Edit failed while deleting the old messages:', err);
      alert(L('تعذر التعديل. حاول مرة ثانية.', "Couldn't edit the message. Please try again."));
      restore(); return;
    }
  } else {
    const g = getGuestChat();
    if(meta.guestIndex === undefined || meta.guestIndex >= g.length){ restore(); return; }
    before = g.slice(0, meta.guestIndex);
    saveGuestChat(before);
  }
  trackEvent('message_edited');
  await runTurn({
    text: newText, attachment: null,
    history: capHistory(historyFromMsgs(before)),
    showUser: true,
    // remove the edited bubble and everything after it from the screen
    onAccepted: () => { let n = bubbleEl; while(n){ const next = n.nextElementSibling; n.remove(); n = next; } }
  });
}

// ---- Regenerate: ask again for the newest reply. The old reply is kept (hidden) until the
// new one has arrived, so a failed attempt never costs the student a good answer. ----
async function regenerateLast(){
  if(isStreaming) return;
  let userMsg, botMsg, history;
  if(currentUser){
    const n = currentMsgs.length;
    if(n < 2 || currentMsgs[n - 1].role !== 'bot' || currentMsgs[n - 2].role !== 'user') return;
    userMsg = currentMsgs[n - 2]; botMsg = currentMsgs[n - 1];
    history = capHistory(historyFromMsgs(currentMsgs.slice(0, n - 2)));
  } else {
    const g = getGuestChat(); const n = g.length;
    if(n < 2 || g[n - 1].role !== 'bot' || g[n - 2].role !== 'user') return;
    if(guestQuestionCount() >= GUEST_LIMIT) return; // for guests a regeneration counts as a question
    userMsg = g[n - 2]; botMsg = g[n - 1];
    history = capHistory(historyFromMsgs(g.slice(0, n - 2)));
  }

  // Rebuild what was originally sent.
  let text = userMsg.text || '', attachment = null;
  const att = userMsg.attachment;
  if(lastTurn && lastTurn.chatId === currentChatId && lastTurn.text === text && lastTurn.attachment){
    attachment = lastTurn.attachment;                       // still in memory from this session: the exact original
  } else if(att && att.kind === 'image' && att.dataUrl){
    attachment = { kind: 'image', dataUrl: att.dataUrl, data: att.dataUrl.split(',')[1], mimeType: 'image/jpeg', name: att.name };
  } else if(att && att.kind === 'text'){
    text = userMsg.memory || text;                          // the saved copy already contains the file's text
  } else if(att){
    alert(L('لا يمكن إعادة التوليد لهذا الملف بعد إعادة تحميل الصفحة. أرفقه من جديد وأرسله.', "This file can't be re-sent after a page reload. Attach it again and resend."));
    return;
  }

  const botBubble = [...document.querySelectorAll('#chatInner .bubble.bot')].pop();
  const next = botBubble && botBubble.nextElementSibling;
  const botRow = next && next.classList.contains('msg-actions') ? next : null;
  await runTurn({ text, attachment, history, showUser: false, oldBot: { els: [botBubble, botRow].filter(Boolean), id: botMsg.id } });
}

function addBubble(role, text, scroll = true, attachment = null){
  const inner = document.getElementById('chatInner');
  const welcome = document.getElementById('welcome');
  if(welcome) welcome.remove();
  const b = document.createElement('div');
  b.className = 'bubble ' + role;
  if(role === 'bot'){
    renderBotContent(b, text);
  } else {
    if(attachment){
      if(attachment.kind === 'image' && attachment.dataUrl){
        const img = document.createElement('img'); img.src = attachment.dataUrl; img.className = 'msg-img'; b.appendChild(img);
      } else {
        const chip = document.createElement('div'); chip.className = 'file-chip';
        chip.textContent = (attachment.kind === 'pdf' ? '📄 ' : attachment.kind === 'image' ? '🖼️ ' : '📝 ') + (attachment.name || '');
        b.appendChild(chip);
      }
    }
    if(text){ const t = document.createElement('div'); t.textContent = text; b.appendChild(t); }
  }
  inner.appendChild(b);
  if(scroll) document.getElementById('chatScroll').scrollTop = 999999;
  return b;
}

// ---- File upload (logged-in users only; the composer button is disabled for guests) ----
// pendingAttachment: { kind:'image'|'pdf'|'text', dataUrl?, data?(base64), mimeType?, text?, name }
let pendingAttachment = null;

function showAttachmentPreview(){
  const img = document.getElementById('previewImg');
  const nameEl = document.getElementById('previewName');
  document.getElementById('imagePreview').classList.remove('hidden');
  if(pendingAttachment.kind === 'image'){
    img.style.display = ''; img.src = pendingAttachment.dataUrl;

// ---- Office formats: extracted to plain text in the browser, then handled
// exactly like a .txt upload (kind:'text') — no backend changes needed. ----
// ---- Image helpers (used by direct uploads AND by pictures pulled out of DOCX/PPTX) ----
const MAX_PDF_BYTES = 2.5 * 1024 * 1024; // Vercel rejects request bodies over ~4.5 MB and base64 adds a third
const readAsDataURL = file => new Promise((resolve, reject) => {
  const r = new FileReader();
  r.onload = () => resolve(r.result);
  r.onerror = () => reject(r.error || new Error('read failed'));
  r.readAsDataURL(file);
});
const loadImage = src => new Promise((resolve, reject) => {
  const i = new Image();
  i.onload = () => resolve(i);
  i.onerror = () => reject(new Error('image decode failed'));
  i.src = src;
});
// Shrinks to <=1024px and re-encodes as JPEG so requests stay small. Transparent PNGs (very common
// for circuit diagrams) are flattened onto WHITE first — otherwise JPEG turns transparency black
// and the drawing becomes invisible to the AI.
async function compressToJpeg(src, maxDim = 1024, quality = 0.7){
  const img = await loadImage(src);
  let { width, height } = img;
  if(width > maxDim || height > maxDim){
    const s = maxDim / Math.max(width, height);
    width = Math.round(width * s); height = Math.round(height * s);
  }
  const canvas = document.createElement('canvas');
  canvas.width = width; canvas.height = height;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, width, height);
  ctx.drawImage(img, 0, 0, width, height);
  return canvas.toDataURL('image/jpeg', quality);
}

async function parseDocx(file){
  const arrayBuffer = await file.arrayBuffer();
  const result = await mammoth.extractRawText({ arrayBuffer });
  return result.value;
}
async function parseXlsx(file){
  const arrayBuffer = await file.arrayBuffer();
  const wb = XLSX.read(arrayBuffer, { type: 'array' });
  return wb.SheetNames.map(name => `--- ${name} ---\n` + XLSX.utils.sheet_to_csv(wb.Sheets[name])).join('\n\n');
}
// Pulls embedded raster images (photos/screenshots pasted into the file) out of
// a DOCX/PPTX — both are just ZIP archives, so we can reuse JSZip for this too.
// Native vector charts/SmartArt aren't plain image files, so those are missed —
// a known, accepted limitation.
async function extractZipImages(file, mediaPrefix, maxImages = 8){
  const zip = await JSZip.loadAsync(await file.arrayBuffer());
  const names = Object.keys(zip.files)
    .filter(n => n.startsWith(mediaPrefix) && /\.(png|jpe?g|gif|bmp)$/i.test(n))
    .slice(0, 30); // don't decode hundreds of files
  const images = [];
  let totalChars = 0;
  for(const name of names){
    if(images.length >= maxImages || totalChars > 2500000) break; // keep the request well under Vercel's 4.5 MB
    try {
      const ext = name.split('.').pop().toLowerCase();
      const mime = ext === 'jpg' ? 'image/jpeg' : 'image/' + ext;
      const raw = 'data:' + mime + ';base64,' + await zip.files[name].async('base64');
      const probe = await loadImage(raw);
      if(probe.width < 100 || probe.height < 100) continue; // skip icons, bullets, decorations
      const dataUrl = await compressToJpeg(raw);
      totalChars += dataUrl.length;
      images.push({ data: dataUrl.split(',')[1], mimeType: 'image/jpeg' });
    } catch(e){ /* undecodable image — skip it */ }
  }
  return images;
}

async function parsePptx(file){
  const arrayBuffer = await file.arrayBuffer();
  const zip = await JSZip.loadAsync(arrayBuffer);
  const slideFiles = Object.keys(zip.files)
    .filter(n => /^ppt\/slides\/slide\d+\.xml$/.test(n))
    .sort((a, b) => parseInt(a.match(/slide(\d+)/)[1]) - parseInt(b.match(/slide(\d+)/)[1]));
  const slides = [];
  for(const name of slideFiles){
    const xml = await zip.files[name].async('text');
    const texts = [...xml.matchAll(/<a:t>(.*?)<\/a:t>/g)].map(m => m[1]);
    slides.push(`--- Slide ${name.match(/slide(\d+)/)[1]} ---\n${texts.join(' ')}`);
  }
  return slides.join('\n\n');
}

document.getElementById('fileInput').addEventListener('change', async (e)=>{
  const file = e.target.files[0];
  e.target.value = '';
  if(!file) return;
  const isImage = file.type.startsWith('image/');
  const isPdf = file.type === 'application/pdf' || /\.pdf$/i.test(file.name);
  const isText = file.type === 'text/plain' || file.type === 'text/csv' || /\.(txt|csv)$/i.test(file.name);
  const isDocx = /\.docx$/i.test(file.name);
  const isXlsx = /\.xlsx$/i.test(file.name);
  const isPptx = /\.pptx$/i.test(file.name);

  if(isDocx || isXlsx || isPptx){
    if(file.size > 8 * 1024 * 1024){ alert(getLang()==='ar' ? 'حجم الملف كبير (حد 8 ميجا).' : 'File too large (8MB max).'); return; }
    document.getElementById('imagePreview').classList.remove('hidden');
    document.getElementById('previewImg').style.display = 'none';
    const nameEl = document.getElementById('previewName');
    nameEl.style.display = ''; nameEl.textContent = (getLang()==='ar' ? '⏳ جاري قراءة ' : '⏳ Reading ') + file.name;
    try {
      const text = isDocx ? await parseDocx(file) : isXlsx ? await parseXlsx(file) : await parsePptx(file);
      const images = isDocx ? await extractZipImages(file, 'word/media/')
                   : isPptx ? await extractZipImages(file, 'ppt/media/')
                   : [];
      pendingAttachment = { kind: 'text', text: text.slice(0, 20000), name: file.name, images: images.length ? images : undefined };
      showAttachmentPreview();
    } catch(err){
      document.getElementById('imagePreview').classList.add('hidden');
      alert((getLang()==='ar' ? 'تعذرت قراءة الملف: ' : "Couldn't read the file: ") + err.message);
    }
    return;
  }

  if(isImage){
    try {
      const dataUrl = await compressToJpeg(await readAsDataURL(file));
      pendingAttachment = { kind: 'image', dataUrl, data: dataUrl.split(',')[1], mimeType: 'image/jpeg', name: file.name };
      showAttachmentPreview();
    } catch(err){
      alert(getLang()==='ar' ? 'تعذرت قراءة الصورة (جرّب JPG أو PNG).' : "Couldn't read this image (try JPG or PNG).");
    }
  } else if(isPdf){
    if(file.size > MAX_PDF_BYTES){ alert(getLang()==='ar' ? 'حجم PDF كبير (الحد 2.5 ميجا).' : 'PDF too large (2.5MB max).'); return; }
    const dataUrl = await readAsDataURL(file);
    pendingAttachment = { kind: 'pdf', dataUrl, data: dataUrl.split(',')[1], mimeType: 'application/pdf', name: file.name };
    showAttachmentPreview();
  } else if(isText){
    const reader = new FileReader();
    reader.onload = ()=>{
      pendingAttachment = { kind: 'text', text: String(reader.result).slice(0, 20000), name: file.name };
      showAttachmentPreview();
    };
    reader.readAsText(file);
  } else {
    alert(getLang()==='ar' ? 'هذه الصيغة غير مدعومة بعد.' : "This file type isn't supported yet.");
  }
});
document.getElementById('removeImage').addEventListener('click', ()=>{
  pendingAttachment = null;
  document.getElementById('imagePreview').classList.add('hidden');
});

// Streams the reply token-by-token from /api/chat (Server-Sent Events / chunked response).
// The API route (api/chat.js) is responsible for picking a provider (Groq/Gemini),
// rotating keys, and forwarding the stream — this file just renders it.
// Cleans the raw first message into something title-shaped: strips markdown/
// newlines, trims to ~40 chars at a word boundary instead of mid-word.
function makeChatTitle(text){
  if(!text) return '';
  let t = text.replace(/[#*`_>\n\r]+/g, ' ').replace(/\s+/g, ' ').trim();
  if(t.length <= 40) return t;
  const cut = t.slice(0, 40);
  const lastSpace = cut.lastIndexOf(' ');
  return (lastSpace > 15 ? cut.slice(0, lastSpace) : cut) + '…';
}

const MAX_MESSAGE_CHARS = 12000;
const MAX_REQUEST_BYTES = 4300000; // Vercel rejects request bodies over ~4.5 MB

function userError(message, status){ const e = new Error(message); e.userMessage = message; e.status = status; return e; }
function formatWait(sec, ar){
  if(sec >= 7200) return Math.ceil(sec / 3600) + (ar ? ' ساعة' : ' h');
  if(sec >= 120)  return Math.ceil(sec / 60) + (ar ? ' دقيقة' : ' min');
  return sec + (ar ? ' ثانية' : ' s');
}
function httpError(status, retryAfter){
  const ar = getLang() === 'ar';
  if(status === 413) return userError(ar ? 'الملف أو الرسالة كبيرة جداً للإرسال. جرّب أصغر.' : 'The file or message is too large to send. Try a smaller one.', status);
  if(status === 504 || status === 408) return userError(ar ? 'انتهت مهلة الخادم. جرّب مرة ثانية أو بملف أصغر.' : 'The server timed out. Try again, or with a smaller file.', status);
  if(status === 401) return userError(ar ? 'انتهت جلستك. سجّل الدخول من جديد.' : 'Your session expired. Please sign in again.', status);
  if(status === 403) return userError(ar ? 'هذه الميزة (الملفات) متاحة بعد تسجيل الدخول.' : 'This feature (files) needs you to sign in.', status);
  if(status === 429) return userError(ar ? 'طلبات كثيرة بسرعة. انتظر ' + formatWait(retryAfter || 30, true) + ' وجرّب.' : 'Too many requests too fast. Wait ' + formatWait(retryAfter || 30, false) + ' and try again.', status);
  if(status === 503) return userError(ar ? 'الخدمة غير متاحة مؤقتاً. جرّب بعد قليل.' : 'The service is temporarily unavailable. Try again shortly.', status);
  return userError((ar ? 'خطأ من الخادم (' : 'Server error (') + status + ').', status);
}
// A guest shouldn't lose one of their 15 questions to a failed answer.
function rollbackGuestTurn(){
  const g = getGuestChat();
  if(g.length && g[g.length - 1].role === 'user') g.pop();
  saveGuestChat(g);
  localStorage.setItem('guestTotal', String(Math.max(0, guestQuestionCount() - 1)));
  applyGuestUI();
}

// One AI turn, shared by "send", "regenerate" and "edit":
//   showUser  — add + save the student's message first (send, edit); false for regenerate.
//   oldBot    — {els, id}: the reply being replaced (regenerate). Hidden now, removed only once the new one is safe.
//   onAccepted — runs once the request is known to be sendable (clear the input, etc.).
async function runTurn({ text, attachment, history, showUser, oldBot = null, onAccepted = null }){
  if(isStreaming) return false;
  const ar = getLang() === 'ar';

  // Build the request FIRST: (1) the history it carries must not include this very message,
  // (2) an oversized request can be refused without losing what the student typed or attached.
  const payload = JSON.stringify({
    message: text, lang: getLang(),
    attachment: attachment ? { kind: attachment.kind, data: attachment.data, mimeType: attachment.mimeType, text: attachment.text, name: attachment.name, images: attachment.images } : undefined,
    history
  });
  if(new Blob([payload]).size > MAX_REQUEST_BYTES){
    alert(ar ? 'الطلب كبير جداً (الحد حوالي 4 ميجا). جرّب ملفاً أصغر أو صوراً أقل.' : 'The request is too large (about 4 MB max). Try a smaller file or fewer images.');
    return false;
  }
  if(onAccepted) onAccepted();

  document.querySelectorAll('.regen-btn').forEach(b => b.remove()); // only the newest reply can be regenerated
  const bubbleAttachment = attachment ? { kind: attachment.kind, dataUrl: attachment.dataUrl, name: attachment.name } : null;
  const userEl = showUser ? addBubble('user', text, true, bubbleAttachment) : null;
  trackEvent(showUser ? 'message_sent' : 'regenerate_clicked');
  if(oldBot) oldBot.els.forEach(el => { el.style.display = 'none'; });

  isStreaming = true;
  let botBubble = null, savedUser = !showUser, savedBot = false, newBotId = null, ok = false, guestIdx;
  try {
    // 1) Save the student's message. A storage problem must never block the answer.
    if(currentUser){
      if(showUser){
        try {
          if(!currentChatId){
            currentChatId = await createChat(currentUser.uid, makeChatTitle(text) || (attachment ? attachment.name : ''));
            openChat(currentChatId, true);
          }
          await addMessage(currentChatId, 'user', text, bubbleAttachment, attachment ? memoryTextFor(text, attachment) : null);
          savedUser = true;
        } catch(err){ console.error('Saving the message failed:', err); }
      }
    } else {
      const g = getGuestChat();
      if(showUser){ g.push({ role:'user', text }); saveGuestChat(g); guestIdx = g.length - 1; }
      incGuestTotal();
      applyGuestUI(); // update the countdown immediately, not just at the limit
    }

    // 2) Ask the AI and stream the reply into a new bubble.
    botBubble = addBubble('bot', '');
    botBubble.innerHTML = '<span class="cursor-blink"></span>';
    // Signed-in students prove who they are with their Firebase ID token; guests send none.
    const callApi = token => fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: 'Bearer ' + token } : {}) },
      body: payload
    });
    let res = await callApi(currentUser ? await getIdToken() : null);
    if(res.status === 401 && currentUser) res = await callApi(await getIdToken(true)); // token may have just expired: retry once with a fresh one
    if(!res.ok) throw httpError(res.status, parseInt(res.headers.get('retry-after'), 10) || 0);
    if(!res.body) throw userError(ar ? 'لم يصل رد من الخادم.' : 'No response came back from the server.');
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let full = '';
    while(true){
      const { done, value } = await reader.read();
      if(done) break;
      full += decoder.decode(value, { stream: true });
      renderBotContent(botBubble, full);
      document.getElementById('chatScroll').scrollTop = 999999;
    }
    if(!full.trim()) throw userError(ar ? 'لم يصل رد من النموذج. حاول مرة ثانية.' : 'The model returned an empty reply. Please try again.');

    // The server reports "every provider failed" as plain text: show it, but don't save or remember it as an answer.
    if(full.startsWith('⚠️ All providers are currently unavailable')){
      if(!currentUser) rollbackGuestTurn();
      trackEvent('ai_response_error', { error: 'all_providers_unavailable' });
      return false;
    }

    // 3) Save the reply.
    if(currentUser){
      if(currentChatId){
        try { newBotId = await addMessage(currentChatId, 'bot', full); savedBot = true; }
        catch(err){ console.error('Saving the reply failed:', err); }
      }
    } else {
      const g = getGuestChat();
      if(oldBot && g.length && g[g.length - 1].role === 'bot') g.pop(); // regenerate: swap the old reply
      g.push({ role:'bot', text: full }); saveGuestChat(g);
    }
    // Regenerate: the new reply is safe now, so the old one can go.
    if(oldBot){
      if(currentUser && savedBot && oldBot.id){
        try { await deleteMessages(currentChatId, [oldBot.id]); }
        catch(err){ console.error('Removing the old reply failed:', err); }
      }
      oldBot.els.forEach(el => el.remove());
    }
    addMessageActions(botBubble, full, { id: newBotId, isLast: true });
    if(userEl && !currentUser) addUserActions(userEl, text, { guestIndex: guestIdx, canEdit: !attachment });
    // Saved chats rebuild their memory from Firestore (see rebuildHistory); otherwise remember it here.
    if(!(currentUser && savedUser && savedBot)){
      historyForApi = capHistory([...history, { role: 'user', text: memoryTextFor(text, attachment) }, { role: 'bot', text: full }]);
    }
    lastTurn = { text, attachment, chatId: currentChatId };
    trackEvent('ai_response_success');
    ok = true;
  } catch(e){
    console.error('AI turn failed:', e);
    const msg = e.userMessage || (ar ? 'تعذر الاتصال بالمساعد.' : "Couldn't reach the assistant.");
    if(botBubble) botBubble.textContent = '⚠️ ' + msg; else addBubble('bot', '⚠️ ' + msg);
    if(!currentUser) rollbackGuestTurn();
    trackEvent('ai_response_error', { error: String(e.message || e).slice(0, 100) });
  } finally {
    if(oldBot && !ok) oldBot.els.forEach(el => { el.style.display = ''; }); // a failed regeneration restores the old reply
    isStreaming = false;
    // Draw whatever Firestore delivered mid-reply, but only if the reply was saved (otherwise it would vanish).
    if(skippedSnapshot && savedBot) renderMessages(skippedSnapshot);
    skippedSnapshot = null;
  }
  return ok;
}

window.sendMessage = async function(){
  if(isStreaming) return;
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  const attachment = pendingAttachment; // snapshot — cleared once the request is accepted
  if((!text && !attachment) || input.disabled) return;
  if(!currentUser && guestQuestionCount() >= GUEST_LIMIT) return;
  if(text.length > MAX_MESSAGE_CHARS){
    const ar = getLang() === 'ar';
    alert(ar ? 'الرسالة طويلة جداً (الحد ' + MAX_MESSAGE_CHARS + ' حرف). اختصرها أو ارفعها كملف.' : 'The message is too long (limit ' + MAX_MESSAGE_CHARS + ' characters). Shorten it or attach it as a file.');
    return;
  }
  await runTurn({
    text, attachment, history: historyForApi, showUser: true,
    onAccepted: () => {
      input.value = ''; autoGrow(input);
      pendingAttachment = null;
      document.getElementById('imagePreview').classList.add('hidden');
    }
  });
};
</script>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دارة — المحادثة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<style>
  .bubble.bot{text-align:start;}
  .bubble.bot :is(h1,h2,h3){margin:14px 0 6px; font-size:16px;}
  .bubble.bot p{margin:0 0 10px;}
  .bubble.bot p:last-child{margin-bottom:0;}
  .bubble.bot ul,.bubble.bot ol{margin:0 0 10px; padding-inline-start:22px;}
  .bubble.bot li{margin-bottom:4px;}
  .bubble.bot strong{color:var(--copper);}
  .bubble.bot code{font-family:'JetBrains Mono',monospace; font-size:13px;}
  .bubble.bot pre{background:#0B0D0C; border:1px solid var(--line); border-radius:8px; padding:12px 14px; overflow-x:auto; margin:0 0 10px; direction:ltr; text-align:left;}
  .bubble.bot pre code{background:none; color:#EDEFEA; padding:0;}
  .bubble.bot .katex{font-size:1.02em;}
  .bubble.bot hr{border:none; border-top:1px solid var(--line); margin:12px 0;}
  body.loading .chat-app{visibility:hidden;}
  .guest-row{display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:8px; cursor:pointer; color:var(--ink-soft); font-size:13.5px;}
  .guest-row:hover{background:var(--bg); color:var(--ink);}
  .locked-hint{font-size:11px; color:var(--ink-soft); text-align:center; margin-top:2px;}
  .guest-banner{max-width:760px; margin:0 auto 12px; background:var(--surface); border:1px solid var(--copper); border-radius:12px; padding:14px 16px; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;}
  .guest-banner p{font-size:13.5px; color:var(--ink-soft);}
  .guest-banner.hidden{display:none;}
  textarea:disabled{opacity:.5;}
  .icon-round:disabled{opacity:.35; cursor:not-allowed;}
  .guest-countdown{display:flex; align-items:center; gap:6px; font-size:13px; color:var(--ink-soft); background:var(--surface); border:1px solid var(--line); padding:6px 12px; border-radius:20px;}
  .guest-countdown b{color:var(--copper); font-family:'JetBrains Mono',monospace;}
  .footer-guest-actions{display:flex; flex-direction:column; gap:6px;}
  .footer-guest-actions .guest-row{padding:9px 12px;}
</style>
</head>
<body class="loading chat-page">
<div class="chat-app">
  <aside class="sidebar" id="sidebar">
    <button class="btn-primary new-chat" data-i="startChat" onclick="newChat()"></button>
    <input class="search" data-i-ph="search" oninput="filterChats(this.value)">
    <div class="section-label" data-i="projects"></div>
    <div class="chat-item">⚡ مشروع تخرج</div>
    <div class="section-label" data-i="recent" id="recentLabel"></div>
    <div id="chatList"></div>
    <div id="guestNotice" class="locked-hint" data-i="guestSaveHint" style="display:none; padding:0 4px;"></div>
    <div class="sidebar-footer" id="footerLoggedIn" style="display:none;" onclick="location.href='settings.html'">
      <div class="avatar" id="avatarLetter">?</div>
      <div>
        <div style="font-size:14px; font-weight:600;" id="userName">—</div>
        <div style="font-size:12px; color:var(--ink-soft);" data-i="settings"></div>
      </div>
    </div>
    <div class="footer-guest-actions" id="footerGuest" style="display:none;">
      <div class="guest-row" onclick="doSignIn()">
        <div class="avatar" style="background:var(--copper); width:28px; height:28px; font-size:13px;">G</div>
        <span data-i="signIn"></span>
      </div>
      <a href="index.html" class="guest-row" style="text-decoration:none;">
        <span style="width:28px; text-align:center;">←</span>
        <span data-i="guestBack"></span>
      </a>
    </div>
  </aside>

  <main class="chat-main">
    <div class="chat-topbar">
      <button class="icon-btn" id="sidebarToggle">☰</button>
      <div class="guest-countdown" id="guestCountdown" style="display:none;">⏳ <b id="guestRemaining">15</b></div>
    </div>
    <div class="chat-scroll" id="chatScroll">
      <div class="chat-inner" id="chatInner">
        <div class="welcome" id="welcome">
          <h2 id="welcomeTitle" data-i="welcomeTitle"></h2>
          <p id="welcomeSub" data-i="welcomeSub"></p>
        </div>
      </div>
    </div>
    <div class="composer">
      <div class="guest-banner hidden" id="guestBanner">
        <p data-i="guestLimitMsg"></p>
        <button class="btn-primary" style="padding:9px 18px; font-size:14px;" onclick="doSignIn()" data-i="signIn"></button>
      </div>
      <div class="composer-inner">
        <div class="composer-actions">
          <button class="icon-round" id="fileBtn" title="upload file" onclick="document.getElementById('fileInput').click()">📎</button>
          <input type="file" id="fileInput" style="display:none">
          <button class="icon-round" title="voice input" id="micBtn">🎤</button>
        </div>
        <textarea id="msgInput" rows="1" data-i-ph="placeholder" oninput="autoGrow(this)" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage();}"></textarea>
        <button class="icon-round send" onclick="sendMessage()">➤</button>
      </div>
      <div class="hint" id="disclaimer" data-i="disclaimer"></div>
    </div>
  </main>
</div>

<script src="assets/lang.js"></script>
<script type="module">
import { watchAuth, createChat, watchUserChats, watchMessages, addMessage } from './assets/firebase.js';

const GUEST_LIMIT = 15;
let currentUser = null;
let currentChatId = null;
let unsubChats = null;
let unsubMessages = null;

function getGuestChat(){ return JSON.parse(localStorage.getItem('guestChat') || '[]'); }
function saveGuestChat(arr){ localStorage.setItem('guestChat', JSON.stringify(arr)); }
function guestQuestionCount(){ return getGuestChat().filter(m => m.role === 'user').length; }

window.doSignIn = function(){ location.href = 'login.html'; };

function applyGuestUI(){
  document.getElementById('footerLoggedIn').style.display = 'none';
  document.getElementById('footerGuest').style.display = 'flex';
  document.getElementById('recentLabel').style.display = 'none';
  document.getElementById('chatList').style.display = 'none';
  document.getElementById('guestNotice').style.display = 'block';
  document.getElementById('fileBtn').disabled = true;
  document.getElementById('micBtn').disabled = true;
  const count = guestQuestionCount();
  const atLimit = count >= GUEST_LIMIT;
  document.getElementById('guestBanner').classList.toggle('hidden', !atLimit);
  document.getElementById('msgInput').disabled = atLimit;
  document.getElementById('guestCountdown').style.display = 'flex';
  document.getElementById('guestRemaining').textContent = Math.max(0, GUEST_LIMIT - count);
}
function applyAuthedUI(user){
  document.getElementById('footerLoggedIn').style.display = 'flex';
  document.getElementById('footerGuest').style.display = 'none';
  document.getElementById('recentLabel').style.display = '';
  document.getElementById('chatList').style.display = '';
  document.getElementById('guestNotice').style.display = 'none';
  document.getElementById('fileBtn').disabled = false;
  document.getElementById('micBtn').disabled = false;
  document.getElementById('guestBanner').classList.add('hidden');
  document.getElementById('msgInput').disabled = false;
  document.getElementById('guestCountdown').style.display = 'none';
  document.getElementById('userName').textContent = user.displayName || user.email;
  document.getElementById('avatarLetter').textContent = (user.displayName || user.email || '?').charAt(0).toUpperCase();
}

async function migrateGuestChatIfAny(uid){
  const guest = getGuestChat();
  if(!guest.length) return null;
  const firstUserMsg = guest.find(m => m.role === 'user')?.text || '';
  const newId = await createChat(uid, firstUserMsg);
  for(const m of guest) await addMessage(newId, m.role, m.text);
  saveGuestChat([]);
  return newId;
}

watchAuth(async user => {
  currentUser = user;
  document.body.classList.remove('loading');

  if(user){
    const migratedId = await migrateGuestChatIfAny(user.uid);
    applyAuthedUI(user);
    if(unsubChats) unsubChats();
    unsubChats = watchUserChats(user.uid, chats=>{
      renderChatList(chats);
      if(migratedId && !currentChatId) openChat(migratedId);
    });
  } else {
    if(unsubChats) unsubChats();
    applyGuestUI();
    const guest = getGuestChat();
    if(guest.length){
      document.getElementById('chatInner').innerHTML = '';
      guest.forEach(m => addBubble(m.role, m.text, false));
      document.getElementById('chatScroll').scrollTop = 999999;
    }
  }
});

window.autoGrow = function(el){ el.style.height='auto'; el.style.height=el.scrollHeight+'px'; };

document.getElementById('sidebarToggle').addEventListener('click', ()=>{
  if(window.innerWidth <= 820){
    document.getElementById('sidebar').classList.toggle('open');
  } else {
    document.querySelector('.chat-app').classList.toggle('sidebar-collapsed');
  }
});

window.newChat = function(){
  currentChatId = null;
  if(unsubMessages) unsubMessages();
  if(!currentUser) saveGuestChat([]);
  document.getElementById('chatInner').innerHTML = `
    <div class="welcome" id="welcome"><h2 id="welcomeTitle" data-i="welcomeTitle"></h2><p id="welcomeSub" data-i="welcomeSub"></p></div>`;
  applyLang();
  document.querySelectorAll('.chat-item').forEach(el=>el.classList.remove('active'));
  if(!currentUser) applyGuestUI();
};

let lastChats = [];
function renderChatList(chats){
  lastChats = chats;
  const list = document.getElementById('chatList');
  list.innerHTML = chats.map(c =>
    `<div class="chat-item ${c.id===currentChatId?'active':''}" data-id="${c.id}">${c.title}</div>`).join('') ||
    '<div class="chat-item" style="opacity:.5">—</div>';
  list.querySelectorAll('.chat-item').forEach(el=>{
    el.addEventListener('click', ()=> openChat(el.dataset.id));
  });
}
window.filterChats = function(q){
  document.querySelectorAll('.chat-item').forEach(el=>{
    el.style.display = el.textContent.includes(q) ? '' : 'none';
  });
};

function openChat(chatId){
  currentChatId = chatId;
  renderChatList(lastChats);
  const inner = document.getElementById('chatInner');
  inner.innerHTML = '';
  if(unsubMessages) unsubMessages();
  unsubMessages = watchMessages(chatId, msgs=>{
    inner.innerHTML = '';
    msgs.forEach(m => addBubble(m.role, m.text, false));
    document.getElementById('chatScroll').scrollTop = 999999;
  });
}

function renderBotContent(el, text){
  el.innerHTML = window.marked ? marked.parse(text || '', { breaks: true }) : (text || '');
  if(window.renderMathInElement){
    renderMathInElement(el, {
      delimiters: [
        { left: '$$', right: '$$', display: true },
        { left: '\\(', right: '\\)', display: false },
        { left: '$', right: '$', display: false }
      ],
      throwOnError: false
    });
  }
  if(window.hljs) el.querySelectorAll('pre code').forEach(block => hljs.highlightElement(block));
}

function addBubble(role, text, scroll = true){
  const inner = document.getElementById('chatInner');
  const welcome = document.getElementById('welcome');
  if(welcome) welcome.remove();
  const b = document.createElement('div');
  b.className = 'bubble ' + role;
  if(role === 'bot') renderBotContent(b, text); else b.textContent = text;
  inner.appendChild(b);
  if(scroll) document.getElementById('chatScroll').scrollTop = 999999;
  return b;
}

// Streams the reply token-by-token from /api/chat (Server-Sent Events / chunked response).
// The API route (api/chat.js) is responsible for picking a provider (Groq/Gemini),
// rotating keys, and forwarding the stream — this file just renders it.
window.sendMessage = async function(){
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if(!text || input.disabled) return;
  if(!currentUser && guestQuestionCount() >= GUEST_LIMIT) return;

  input.value = ''; autoGrow(input);
  addBubble('user', text);

  if(currentUser){
    if(!currentChatId){ currentChatId = await createChat(currentUser.uid, text); openChat(currentChatId); }
    await addMessage(currentChatId, 'user', text);
  } else {
    const g = getGuestChat(); g.push({role:'user', text}); saveGuestChat(g);
  }

  const botBubble = addBubble('bot', '');
  botBubble.innerHTML = '<span class="cursor-blink"></span>';

  try{
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ message: text, lang: getLang() })
    });
    if(!res.body) throw new Error('no stream');
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let full = '';
    while(true){
      const {done, value} = await reader.read();
      if(done) break;
      full += decoder.decode(value, {stream:true});
      renderBotContent(botBubble, full);
      document.getElementById('chatScroll').scrollTop = 999999;
    }
    if(currentUser){
      await addMessage(currentChatId, 'bot', full);
    } else {
      const g = getGuestChat(); g.push({role:'bot', text: full}); saveGuestChat(g);
      if(guestQuestionCount() >= GUEST_LIMIT) applyGuestUI();
    }
  } catch(e){
    botBubble.textContent = '⚠️ تعذر الاتصال بالمساعد.';
  }
};
</script>
</body>
</html>
